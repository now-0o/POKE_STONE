name: Temporary shiny admin UI hotfix

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/shiny-admin-ui-trigger.txt'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply requested shiny changes
        run: |
          python3 <<'PY'
          from pathlib import Path

          card = Path('src/components/Card.jsx')
          text = card.read_text()
          old = '      {shownShiny && <div className="shiny-badge">✨ 이로치</div>}\n\n'
          if old not in text:
              raise SystemExit('shiny card badge markup not found')
          card.write_text(text.replace(old, '', 1))

          pack = Path('src/components/PackShop.jsx')
          text = pack.read_text()
          old = '{r.shiny && <span className="shiny-pack-label"> ✨ 이로치!</span>}'
          new = '{r.shiny && <span className="shiny-pack-label"> · 이로치!</span>}'
          if old not in text:
              raise SystemExit('shiny pack label markup not found')
          pack.write_text(text.replace(old, new, 1))

          save = Path('src/state/save.js')
          text = save.read_text()
          old = '''  CARDS.forEach((c) => {\n    save.collection[c.id] = MAX_COPIES[c.rarity] ?? 2;\n  });'''
          new = '''  save.shinyCollection = {};\n\n  CARDS.forEach((c) => {\n    const maxCopies = MAX_COPIES[c.rarity] ?? 2;\n    save.collection[c.id] = maxCopies;\n\n    if (isShinyEligible(c)) {\n      save.shinyCollection[c.id] = maxCopies;\n    }\n  });\n\n  ensureShinyState(save);'''
          if old not in text:
              raise SystemExit('admin collection grant block not found')
          save.write_text(text.replace(old, new, 1))
          PY
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit hotfix
        run: |
          git config user.name "poke-stone-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/Card.jsx src/components/PackShop.jsx src/state/save.js
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "fix: simplify shiny UI and grant shinies in admin mode"
          git push origin HEAD:${{ github.head_ref }}
