name: Shiny deck hotfix

# trigger: source hotfix v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shiny-deck-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve shiny deck state and add summon glint
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'src/engine/sinnoh/index.js': [
                  (
                      'export function createGame(playerDeckIds, trainer) {\n  const game = base.createGame(playerDeckIds, trainer);',
                      'export function createGame(playerDeckIds, trainer, playerDeckShiny = null) {\n  const game = base.createGame(playerDeckIds, trainer, playerDeckShiny);',
                  ),
              ],
              'src/engine/cynthia/index.js': [
                  (
                      'export function createGame(playerDeckIds, trainer) {\n  const game = base.createGame(playerDeckIds, trainer);',
                      'export function createGame(playerDeckIds, trainer, playerDeckShiny = null) {\n  const game = base.createGame(playerDeckIds, trainer, playerDeckShiny);',
                  ),
              ],
              'src/engine/cynthia/balance.js': [
                  (
                      'export function createGame(playerDeckIds, trainer) {\n  const game = cynthia.createGame(playerDeckIds, trainer);',
                      'export function createGame(playerDeckIds, trainer, playerDeckShiny = null) {\n  const game = cynthia.createGame(playerDeckIds, trainer, playerDeckShiny);',
                  ),
              ],
              'src/engine/wake-balance.js': [
                  (
                      'export function createGame(playerDeckIds, trainer) {\n  const game = core.createGame(playerDeckIds, trainer);',
                      'export function createGame(playerDeckIds, trainer, playerDeckShiny = null) {\n  const game = core.createGame(playerDeckIds, trainer, playerDeckShiny);',
                  ),
              ],
              'src/components/DeckEditor.jsx': [
                  (
                      '                key={card.id}\n                className="deck-row"',
                      '                key={`${card.id}-${shiny ? "shiny" : "normal"}`}\n                className={`deck-row ${shiny ? "deck-row-shiny" : ""}`}',
                  ),
              ],
              'src/components/MobileDeckEditorLandscape.jsx': [
                  (
                      '<Sprite cardId={card.id} emoji={card.emoji} size={20} />',
                      '<Sprite cardId={card.id} shiny={shiny} emoji={card.emoji} size={20} />',
                  ),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  old_count = text.count(old)
                  new_count = text.count(new)
                  if old_count == 1:
                      text = text.replace(old, new, 1)
                  elif old_count == 0 and new_count == 1:
                      pass
                  else:
                      raise SystemExit(
                          f'{filename}: unexpected matches old={old_count} new={new_count}: {old[:80]!r}'
                      )
              path.write_text(text)

          shiny_css = Path('src/styles/shiny.css')
          css = shiny_css.read_text()
          marker = '/* 이로치 소환 순간 반짝임 */'
          if marker not in css:
              css += r'''

/* 이로치 소환 순간 반짝임 */
.field-unit.shiny-unit .unit-art {
  position: relative;
  animation: shiny-summon-glint 760ms ease-out 1;
}

.field-unit.shiny-unit .unit-art::after {
  content: "";
  position: absolute;
  inset: -10px;
  pointer-events: none;
  border-radius: 50%;
  opacity: 0;
  background:
    radial-gradient(circle at 18% 24%, rgba(255,255,255,.95) 0 2px, transparent 3px),
    radial-gradient(circle at 80% 18%, rgba(255,240,142,.95) 0 2px, transparent 3px),
    radial-gradient(circle at 88% 70%, rgba(255,255,255,.9) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 20% 78%, rgba(255,231,103,.9) 0 1.5px, transparent 2.5px);
  animation: shiny-summon-sparkles 760ms ease-out 1;
}

@keyframes shiny-summon-glint {
  0% { filter: brightness(1) drop-shadow(0 0 0 rgba(255,235,120,0)); }
  32% { filter: brightness(1.65) drop-shadow(0 0 10px rgba(255,235,120,.9)); }
  68% { filter: brightness(1.15) drop-shadow(0 0 5px rgba(255,235,120,.45)); }
  100% { filter: brightness(1) drop-shadow(0 0 0 rgba(255,235,120,0)); }
}

@keyframes shiny-summon-sparkles {
  0%, 12% { opacity: 0; transform: scale(.72) rotate(-8deg); }
  34% { opacity: 1; transform: scale(1.02) rotate(2deg); }
  72% { opacity: .7; transform: scale(1.14) rotate(8deg); }
  100% { opacity: 0; transform: scale(1.22) rotate(12deg); }
}

@media (prefers-reduced-motion: reduce) {
  .field-unit.shiny-unit .unit-art,
  .field-unit.shiny-unit .unit-art::after {
    animation-duration: 120ms;
  }
}
'''
              shiny_css.write_text(css)
          PY

      - name: Commit hotfix
        run: |
          git config user.name "poke-stone-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/engine/sinnoh/index.js src/engine/cynthia/index.js src/engine/cynthia/balance.js src/engine/wake-balance.js src/components/DeckEditor.jsx src/components/MobileDeckEditorLandscape.jsx src/styles/shiny.css
          git diff --cached --quiet && exit 0
          git commit -m "fix: preserve shiny deck cards in battle"
          git push
