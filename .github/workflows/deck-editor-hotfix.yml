name: Temporary deck editor hotfix

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/deck-editor-hotfix-trigger.txt'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply hotfix
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/components/DeckEditor.jsx')
          text = p.read_text()
          old = '{renderCollectionCards(ownedCards)}'
          new = '{renderCollectionCards(ownedVariants)}'
          if old not in text:
              raise SystemExit('expected desktop render call not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit hotfix
        run: |
          git config user.name "poke-stone-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/DeckEditor.jsx
          git commit -m "fix: render shiny variants in desktop deck editor"
          git push origin HEAD:${{ github.head_ref }}
