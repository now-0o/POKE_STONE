name: Temporary shiny PR implementation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/shiny-pr-trigger.txt'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply shiny system
        run: |
          python3 .github/scripts/shiny_patch.py
          python3 <<'PY'
          from pathlib import Path
          for path in [
              Path('src/components/DeckEditor.jsx'),
              Path('src/components/MobileDeckEditorPortrait.jsx'),
              Path('src/components/MobileDeckEditorLandscape.jsx'),
          ]:
              text = path.read_text()
              text = text.replace(
                  'className={`deck-row ${shiny ? "deck-row-shiny" : ""}`\n',
                  'className={`deck-row ${shiny ? "deck-row-shiny" : ""}`}\n',
              )
              path.write_text(text)
          PY
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "poke-stone-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "feat: add shiny card collection and deck variants"
          git push origin HEAD:${{ github.head_ref }}
