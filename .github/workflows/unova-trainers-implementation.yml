              '''  if (owner) {\n    owner.field.forEach((u) => {\n      if (u.uid !== unit.uid && AURA_TYPES[u.ability] === unit.type) {\n        atk += 1;\n      }\n    });\n  }\n\n  if (\n    game.trainer?.gimmick === "elesa_spotlight" &&\n    hasAbility(unit, "elesa_centerstage") &&\n    owner?._spotlightUid === unit.uid &&\n    game.turn === unit.side\n  ) {\n    atk += 2;\n  }\n\n  if (\n    game.trainer?.gimmick === "drayden_trials" &&\n    unit.side === "enemy" &&\n    unit.type === "드래곤"\n  ) {\n    atk += game._draydenDominance || 0;\n  }\n\n  return Math.max(0, atk);''',
              1,
          )

