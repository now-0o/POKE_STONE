              '''    case "lenora_review": {\n      if (side === "player") game.players.player._reviewPenaltyUsed = false;\n      break;\n    }\n\n    case "burgh_cocoon": {\n      if (side !== "enemy") break;\n      const enemy = game.players.enemy;\n      [...enemy.field].forEach((unit) => {\n        if (!unit._burghCocoon || unit.hp <= 0) return;\n        unit._burghCocoonAge = (unit._burghCocoonAge || 0) + 1;\n        if (unit._burghCocoonAge >= 1) evolveBurghCocoon(game, unit);\n      });\n      cleanupDeaths(game);\n      break;\n    }\n\n    case "elesa_spotlight": {\n      chooseElesaSpotlight(game, side);\n      break;\n    }\n\n    case "skyla_airborne": {\n      if (side === "enemy") landSkylaAirborne(game);\n      break;\n    }\n\n    case "drayden_trials": {\n      if (side === "player") startDraydenTrial(game);\n      break;\n    }\n\n    default:\n      break;\n  }\n}\n\nfunction startTurn(game, side)''',
              1,
          )

          # turn end gimmicks
          s = s.replace(
              '''    default:\n      break;\n  }\n}\n\nexport function endTurn(game)''',
              '''    case "lenora_review": {\n      if (side !== "player") break;\n      const p = game.players.player;\n      const counts = p._reviewKindsThisTurn || {};\n      const order = ["pokemon", "technique", "item"];\n      let best = null;\n      let bestCount = 0;\n      order.forEach((kind) => {\n        const value = counts[kind] || 0;\n        if (value > bestCount) { best = kind; bestCount = value; }\n      });\n      p._reviewPenaltyKind = best;\n      p._reviewKindsThisTurn = {};\n      if (best) {\n        const label = best === "pokemon" ? "포켓몬" : best === "technique" ? "기술" : "도구";\n        log(game, `알로에의 복습 시험! 다음 턴 첫 ${label} 카드 비용 +2!`);\n      }\n      break;\n    }\n\n    case "skyla_airborne": {\n      if (side === "enemy") launchSkylaAirborne(game);\n      break;\n    }\n\n    case "brycen_frost": {\n      const p = game.players[side];\n      const turnKey = `${game.turnCount}:${side}`;\n      p.field.forEach((u) => {\n        if (u.type === "얼음" || (u._brycenFrost || 0) <= 0) return;\n        if (u._brycenAttackedTurn !== turnKey) {\n          u._brycenFrost = Math.max(0, (u._brycenFrost || 0) - 1);\n          if (u._brycenFrost === 0) log(game, `${u.name}의 냉기가 가라앉았다.`);\n        }\n      });\n      break;\n    }\n\n    case "drayden_trials": {\n      if (side === "player") resolveDraydenTrial(game);\n      break;\n    }\n\n    default:\n      break;\n  }\n}\n\nexport function endTurn(game)''',
