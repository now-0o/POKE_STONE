name: Unova trainer implementation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[unova-trainers]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Implement Unova gyms and effects
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'{label}: anchor not found in {path}')
              p.write_text(s.replace(old, new, 1))

          # ------------------------------------------------------------
          # main imports
          # ------------------------------------------------------------
          replace_once(
              'src/main.jsx',
              "import './data/cards/unova.js';\nimport './data/trainers/sinnoh.js';",
              "import './data/cards/unova.js';\nimport './data/cards/unova-trainers.js';\nimport './data/trainers/unova.js';\nimport './data/trainers/sinnoh.js';",
              'main unova imports',
          )

          # ------------------------------------------------------------
          # region carousel
          # ------------------------------------------------------------
          replace_once(
              'src/features/region-carousel/index.js',
              'const REGION_NAMES = ["관동지방", "성도지방", "호연지방", "신오지방"];',
              'const REGION_NAMES = ["관동지방", "성도지방", "호연지방", "신오지방", "하나지방"];',
              'region names',
          )

          # ------------------------------------------------------------
          # main menu: region label/unlock/card
          # ------------------------------------------------------------
          replace_once(
              'src/components/MainMenu.jsx',
              '''  sinnoh: {\n    name: "신오지방",\n    sub: "SINNOH",\n  },\n};''',
              '''  sinnoh: {\n    name: "신오지방",\n    sub: "SINNOH",\n  },\n  unova: {\n    name: "하나지방",\n    sub: "UNOVA",\n  },\n};''',
              'unova region label',
          )

          replace_once(
              'src/components/MainMenu.jsx',
              '''  const sinnohUnlocked =\n    save.adminMode ||\n    (hoennLastTrainer && (save.wins?.[hoennLastTrainer.id] || 0) > 0);''',
              '''  const sinnohUnlocked =\n    save.adminMode ||\n    (hoennLastTrainer && (save.wins?.[hoennLastTrainer.id] || 0) > 0);\n\n  const sinnohTrainers = TRAINERS_BY_REGION.sinnoh || [];\n  const sinnohLastTrainer = sinnohTrainers[sinnohTrainers.length - 1];\n  const unovaUnlocked =\n    save.adminMode ||\n    (sinnohLastTrainer && (save.wins?.[sinnohLastTrainer.id] || 0) > 0);''',
              'unova unlock',
          )

          replace_once(
              'src/components/MainMenu.jsx',
              '''    if (region === "sinnoh" && !sinnohUnlocked) {\n      playSfx("buzzer");\n      return;\n    }''',
              '''    if (region === "sinnoh" && !sinnohUnlocked) {\n      playSfx("buzzer");\n      return;\n    }\n\n    if (region === "unova" && !unovaUnlocked) {\n      playSfx("buzzer");\n      return;\n    }''',
              'unova select lock',
          )

          replace_once(
              'src/components/MainMenu.jsx',
              '''              <span className="region-go">\n                {sinnohUnlocked ? "선택 ▶" : "LOCK"}\n              </span>\n            </button>\n          </div>''',
              '''              <span className="region-go">\n                {sinnohUnlocked ? "선택 ▶" : "LOCK"}\n              </span>\n            </button>\n            <button\n              className={[\n                "region-card",\n                !unovaUnlocked ? "region-locked" : "region-unova",\n              ].join(" ")}\n              onMouseEnter={() => unovaUnlocked && playSfx("cursor")}\n              onClick={() => selectRegion("unova")}\n            >\n              <span className="region-info">\n                <span className="region-name">하나지방</span>\n                <span className="region-sub">UNOVA</span>\n                <span className="region-desc">최상급 AI · 전용 체육관 룰</span>\n                {!unovaUnlocked && (\n                  <span className="region-lock-text">\n                    🔒 신오지방 클리어 후 해금\n                  </span>\n                )}\n              </span>\n              <span className="region-go">\n                {unovaUnlocked ? "선택 ▶" : "LOCK"}\n              </span>\n            </button>\n          </div>''',
              'unova region card',
          )

          # ------------------------------------------------------------
          # engine helpers
          # ------------------------------------------------------------
          engine = Path('src/engine/engine.js')
          s = engine.read_text()
          helper_anchor = '''// ============================================================\n// 트레이너 전용 기믹 - 전투 시작\n// ============================================================'''
          helper_block = r'''// ============================================================
// 하나지방 체육관 공용 헬퍼
// ============================================================
const BURGH_COCOON_EVOLUTIONS = {
  sewaddle: "leavanny",
  venipede: "scolipede",
  dwebble: "crustle",
  karrablast: "escavalier",
  shelmet: "accelgor",
  joltik: "galvantula",
  larvesta: "volcarona",
};

function reviewCardKind(card) {
  if (!card) return null;
  if (card.kind === "pokemon") return "pokemon";
  if (card.kind === "item" || card.kind === "mega") return "item";
  if (card.kind === "spell" && card.type === "도구") return "item";
  if (card.kind === "spell" && card.type === "기술") return "technique";
  return null;
}

function resolveStriatonTrainer(playerDeckIds, trainer) {
  if (trainer?.gimmick !== "striaton_counter" || !trainer.counterDecks) {
    return trainer;
  }

  const pokemon = playerDeckIds
    .map((cardId) => CARD_MAP[cardId])
    .filter((card) => card?.kind === "pokemon");

  const candidates = Object.values(trainer.counterDecks);
  if (!candidates.length) return trainer;

  const scored = candidates.map((entry) => {
    const score = pokemon.reduce((sum, card) => {
      return sum + typeMult(entry.type, card.type);
    }, 0);
    return { entry, score };
  });

  scored.sort((a, b) => b.score - a.score || Math.random() - 0.5);
  const pick = scored[0].entry;

  return {
    ...trainer,
    name: `성신시티 관장 ${pick.member}`,
    sprite: pick.sprite,
    gymType: pick.type,
    deck: pick.deck,
    _striatonMember: pick.member,
  };
}

function evolveBurghCocoon(game, unit) {
  const targetId = unit?._burghEvolveTo;
  const card = targetId ? CARD_MAP[targetId] : null;
  if (!unit || !card || unit.hp <= 0) return false;

  const damageTaken = Math.max(0, unit.maxHp - unit.hp);
  unit.cardId = card.id;
  unit.name = card.name;
  unit.type = card.type;
  unit.atk = card.atk;
  unit.baseAtk = card.atk;
  unit.maxHp = card.hp;
  unit.hp = Math.max(1, card.hp - damageTaken);
  unit.rarity = card.rarity;
  unit.emoji = card.emoji;
  unit.ability = card.ability || null;
  unit.secondaryAbility = card.secondaryAbility || null;
  unit.stage = card.stage || 0;
  unit._burghCocoon = false;
  unit._burghCocoonAge = 0;
  unit._burghEvolveTo = null;

  log(game, `고치가 갈라졌다! ${unit.name}(으)로 우화했다!`);
  runBattlecry(game, unit.side, unit);
  return true;
}

function chooseElesaSpotlight(game, side) {
  const p = game.players[side];
  const candidates = p.field.filter((u) => {
    if (!u || u.hp <= 0) return false;
    if (u.status === "ice" || u.status === "sleep" || (u.frozen || 0) > 0) return false;
    if (hasAbility(u, "darkvoid") || hasAbility(u, "fortress")) return false;
    return effectiveAtk(u, game) > 0;
  });

  const pool = candidates.length ? candidates : p.field.filter((u) => u.hp > 0);
  if (!pool.length) {
    p._spotlightUid = null;
    return;
  }

  const chosen = pool[Math.floor(Math.random() * pool.length)];
  p._spotlightUid = chosen.uid;
  log(game, `스포트라이트 ON! ${chosen.name}만 이번 턴 전투 공격할 수 있다!`);
}

function landSkylaAirborne(game) {
  const enemy = game.players.enemy;
  const player = game.players.player;
  const airborne = enemy.field.filter((u) => u.hp > 0 && u._skylaAirborne);

  airborne.forEach((u) => {
    u._skylaAirborne = false;
    const targets = player.field.filter((target) => target.hp > 0);
    if (!targets.length) return;
    const target = targets[Math.floor(Math.random() * targets.length)];
    const amount = hasAbility(u, "skyla_divebomb") ? 4 : 2;
    applyTypedAbilityDamage(game, target, amount, "비행");
    log(game, `${u.name}의 착륙 급강하! ${target.name}에게 비행 피해 ${amount}!`);
  });

  if (airborne.length) cleanupDeaths(game);
}

function launchSkylaAirborne(game) {
  const enemy = game.players.enemy;
  const alive = enemy.field.filter((u) => u.hp > 0 && !u._skylaAirborne);
  if (!alive.length) return;

  let candidates = alive.filter((u) => u.uid !== enemy._skylaLastAirborneUid);
  if (!candidates.length) candidates = alive;

  const chosen = candidates[Math.floor(Math.random() * candidates.length)];
  chosen._skylaAirborne = true;
  enemy._skylaLastAirborneUid = chosen.uid;
  log(game, `${chosen.name}이(가) 이륙했다! 다음 플레이어 턴에는 전투 공격으로 지정할 수 없다!`);
}

function advanceClayMinecart(game, side, steps = 1) {
  if (game.trainer?.gimmick !== "clay_minecart") return;

  const dir = side === "enemy" ? 1 : -1;
  game._clayMinecart = Math.max(-4, Math.min(4, (game._clayMinecart || 0) + dir * steps));

  log(game, `광산차 게이지 ${game._clayMinecart > 0 ? "+" : ""}${game._clayMinecart}!`);

  if (game._clayMinecart >= 4) {
    game.players.player.field.forEach((u) => {
      if (u.hp > 0) applyTypedAbilityDamage(game, u, 3, "땅");
    });
    log(game, "광산차가 야콘 쪽 끝에 닿았다! 낙반! 플레이어 필드 전체에 땅 피해 3!");
    game._clayMinecart = 0;
    cleanupDeaths(game);
  } else if (game._clayMinecart <= -4) {
    game.players.enemy.field.forEach((u) => {
      if (u.hp > 0) applyDamage(game, u, 2, null, true);
    });
    log(game, "광산차를 역으로 밀어냈다! 광맥 붕괴! 야콘 필드 전체 피해 2!");
    game._clayMinecart = 0;
    cleanupDeaths(game);
  }
}

function trackUnovaCombat(game, side, unit, dealtDamage = 0) {
  if (!unit) return;
  const gimmick = game.trainer?.gimmick;
  const p = game.players[side];
  const turnKey = `${game.turnCount}:${side}`;

  if (gimmick === "drayden_trials" && side === "player") {
    p._draydenTrialAttacks = (p._draydenTrialAttacks || 0) + 1;
  }

  if (gimmick === "clay_minecart" && dealtDamage > 0) {
    const steps = hasAbility(unit, "clay_drillliner") ? 2 : 1;
    advanceClayMinecart(game, side, steps);
  }

  if (gimmick === "brycen_frost" && unit.type !== "얼음" && unit.hp > 0) {
    unit._brycenAttackedTurn = turnKey;
    unit._brycenFrost = Math.min(2, (unit._brycenFrost || 0) + 1);

    if (unit._brycenFrost >= 2) {
      const frozen = applyStatus(game, unit, "ice");
      if (frozen) {
        unit._brycenFrost = 0;
        log(game, `${unit.name}에게 냉기가 누적되어 완전히 얼어붙었다!`);
      } else {
        unit._brycenFrost = 1;
      }
    } else {
      log(game, `${unit.name}에게 냉기가 서렸다. 냉기 1/2.`);
    }
  }
}

function finishElesaCenterStage(game, unit) {
  if (
    game.trainer?.gimmick !== "elesa_spotlight" ||
    !unit ||
    !hasAbility(unit, "elesa_centerstage") ||
    unit.side !== "enemy" ||
    game.players.enemy._spotlightUid !== unit.uid ||
    unit.hp <= 0
  ) {
    return;
  }

  const enemy = game.players.enemy;
  if (enemy.hand.length >= MAX_HAND) return;
  const index = enemy.field.findIndex((u) => u.uid === unit.uid);
  if (index === -1) return;

  enemy.field.splice(index, 1);
  enemy.hand.push({ uid: nextUid(), cardId: unit.cardId });
  enemy._spotlightUid = null;
  log(game, `${unit.name}의 센터 스테이지! 공격을 마치고 카밀레의 손으로 돌아갔다!`);
}

const DRAYDEN_TRIALS = {
  attack_twice: "이번 턴 포켓몬으로 2회 이상 공격하라",
  use_technique: "이번 턴 기술 카드를 1장 이상 사용하라",
  no_technique: "이번 턴 기술 카드를 사용하지 마라",
  spend_mana: "턴 종료 시 남은 마나를 1 이하로 만들어라",
};

function startDraydenTrial(game) {
  const p = game.players.player;
  const pool = ["use_technique", "no_technique", "spend_mana"];
  const readyUnits = p.field.filter((u) => u.hp > 0);
  const canDouble = readyUnits.length >= 2 || readyUnits.some((u) => hasAbility(u, "skilllink"));
  if (canDouble) pool.push("attack_twice");

  let candidates = pool.filter((code) => code !== game._draydenLastTrial);
  if (!candidates.length) candidates = pool;
  const code = candidates[Math.floor(Math.random() * candidates.length)];

  game._draydenLastTrial = code;
  game._draydenTrial = code;
  game._draydenTrialText = DRAYDEN_TRIALS[code];
  p._draydenTrialAttacks = 0;
  p._draydenTechniqueUsed = false;
  log(game, `사간의 용의 시련: ${DRAYDEN_TRIALS[code]}!`);
}

function resolveDraydenTrial(game) {
  const p = game.players.player;
  const code = game._draydenTrial;
  if (!code) return;

  let success = false;
  if (code === "attack_twice") success = (p._draydenTrialAttacks || 0) >= 2;
  else if (code === "use_technique") success = p._draydenTechniqueUsed === true;
  else if (code === "no_technique") success = p._draydenTechniqueUsed !== true;
  else if (code === "spend_mana") success = p.mana <= 1;

  if (success) {
    game._draydenDominance = Math.max(0, (game._draydenDominance || 0) - 1);
    log(game, `용의 시련 성공! 용의 위압 ${(game._draydenDominance || 0)}/4.`);
  } else {
    game._draydenDominance = Math.min(4, (game._draydenDominance || 0) + 1);
    log(game, `용의 시련 실패! 사간의 드래곤 공격력 +${game._draydenDominance}!`);
  }

  game._draydenTrial = null;
  game._draydenTrialText = null;
}

'''
          if helper_anchor not in s:
              raise SystemExit('engine helper anchor missing')
          s = s.replace(helper_anchor, helper_block + helper_anchor, 1)

