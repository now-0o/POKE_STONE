              '''  // 아티 - 고치화: 고치 상태에서는 받는 피해 50% 감소(최소 1)\n  if (\n    !ignoreDefense &&\n    game.trainer?.gimmick === "burgh_cocoon" &&\n    unit.side === "enemy" &&\n    unit._burghCocoon &&\n    dmg > 0\n  ) {\n    const before = dmg;\n    dmg = Math.max(1, Math.ceil(dmg / 2));\n    if (dmg < before) log(game, `${unit.name}의 고치! 받는 피해가 절반으로 감소했다!`);\n  }\n\n  // ============================================================\n  // v6 신규 방어 특성\n  // ============================================================''',
              1,
          )

          # mark play review/trial tracking
          s = s.replace(
              '''function markPlay(game, side, card, extra = null) {\n  markProductiveAction(game, side);''',
              '''function markPlay(game, side, card, extra = null) {\n  markProductiveAction(game, side);\n\n  if (side === "player" && game.trainer?.gimmick === "lenora_review") {\n    const p = game.players.player;\n    const kind = reviewCardKind(card);\n    if (kind) {\n      p._reviewKindsThisTurn = p._reviewKindsThisTurn || {};\n      p._reviewKindsThisTurn[kind] = (p._reviewKindsThisTurn[kind] || 0) + 1;\n      if (kind === p._reviewPenaltyKind && !p._reviewPenaltyUsed) {\n        p._reviewPenaltyUsed = true;\n      }\n    }\n  }\n\n  if (\n    side === "player" &&\n    game.trainer?.gimmick === "drayden_trials" &&\n    card.kind === "spell" &&\n    card.type === "기술"\n  ) {\n    game.players.player._draydenTechniqueUsed = true;\n  }''',
