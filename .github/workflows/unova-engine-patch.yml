          marker='''  cleanupDeaths(game, true);\n\n  game.animSeq = (game.animSeq || 0) + 1;\n\n  game.lastAction = {\n    seq: game.animSeq,\n    kind: "attack",\n    side,\n    uid: attackerUid,\n    targetUid: target.uid,'''
          replacement='''  trackUnovaCombat(game, side, atkUnit, damageDealt);\n  finishElesaCenterStage(game, atkUnit);\n  cleanupDeaths(game, true);\n\n  game.animSeq = (game.animSeq || 0) + 1;\n\n  game.lastAction = {\n    seq: game.animSeq,\n    kind: "attack",\n    side,\n    uid: attackerUid,\n    targetUid: target.uid,'''
          if marker not in s: raise SystemExit('field aftermath anchor missing')
          s=s.replace(marker,replacement,1)

          path.write_text(s)
          PY
          PATCH_STATUS=$?
          if [ $PATCH_STATUS -ne 0 ]; then
            cat /tmp/unova-engine-patch.log
