          rep('''  // ============================================================\n  // v6 신규 방어 특성\n  // ============================================================''','''  if (\n    !ignoreDefense &&\n    game.trainer?.gimmick === "burgh_cocoon" &&\n    unit.side === "enemy" &&\n    unit._burghCocoon &&\n    dmg > 0\n  ) {\n    const before = dmg;\n    dmg = Math.max(1, Math.ceil(dmg / 2));\n    if (dmg < before) log(game, `${unit.name}의 고치! 받는 피해가 절반으로 감소했다!`);\n  }\n\n  // ============================================================\n  // v6 신규 방어 특성\n  // ============================================================''','cocoon reduction')

          rep('''function markPlay(game, side, card, extra = null) {\n  markProductiveAction(game, side);''','''function markPlay(game, side, card, extra = null) {\n  markProductiveAction(game, side);\n\n  if (side === "player" && game.trainer?.gimmick === "lenora_review") {\n    const p = game.players.player;\n    const kind = reviewCardKind(card);\n    if (kind) {\n      p._reviewKindsThisTurn = p._reviewKindsThisTurn || {};\n      p._reviewKindsThisTurn[kind] = (p._reviewKindsThisTurn[kind] || 0) + 1;\n      if (kind === p._reviewPenaltyKind && !p._reviewPenaltyUsed) p._reviewPenaltyUsed = true;\n    }\n  }\n\n  if (\n    side === "player" &&\n    game.trainer?.gimmick === "drayden_trials" &&\n    card.kind === "spell" &&\n    card.type === "기술"\n  ) game.players.player._draydenTechniqueUsed = true;''','markPlay')

          rep('''    } else {\n      p.field.push(unit);\n    }\n    log(game, `${p.name}이(가) ${card.name}을(를) 냈다!`);\n    runBattlecry(game, side, unit);''','''    } else {\n      p.field.push(unit);\n    }\n    if (\n      side === "enemy" &&\n      game.trainer?.gimmick === "burgh_cocoon" &&\n      BURGH_COCOON_EVOLUTIONS[card.id]\n    ) {\n      unit._burghCocoon = true;\n      unit._burghCocoonAge = 0;\n      unit._burghEvolveTo = BURGH_COCOON_EVOLUTIONS[card.id];\n      unit.canAttack = false;\n      log(game, `${card.name}이(가) 고치화했다! 다음 아티 턴 시작에 우화한다!`);\n    }\n    log(game, `${p.name}이(가) ${card.name}을(를) 냈다!`);\n    runBattlecry(game, side, unit);''','summon')

          rep('''  if ((p._roarOfTimeBlockTurns || 0) > 0) {\n    return false;\n  }\n  // 다크라이 - 다크홀''','''  if ((p._roarOfTimeBlockTurns || 0) > 0) {\n    return false;\n  }\n  if (u._burghCocoon) return false;\n  if (\n    game.trainer?.gimmick === "elesa_spotlight" &&\n    p._spotlightUid &&\n    p._spotlightUid !== u.uid\n  ) return false;\n  // 다크라이 - 다크홀''','canAttack')

