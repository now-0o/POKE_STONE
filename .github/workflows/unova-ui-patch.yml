name: Unova gym UI patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[unova-ui]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch UI and registry
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def rep(path, old, new, name):
            p=Path(path); s=p.read_text()
            if old not in s: raise SystemExit(f'{name} anchor missing')
            p.write_text(s.replace(old,new,1))

          rep('src/main.jsx', "import './data/cards/unova.js';\nimport './data/trainers/sinnoh.js';", "import './data/cards/unova.js';\nimport './data/cards/unova-trainers.js';\nimport './data/trainers/unova.js';\nimport './data/trainers/sinnoh.js';", 'main')
          rep('src/features/region-carousel/index.js', 'const REGION_NAMES = ["관동지방", "성도지방", "호연지방", "신오지방"];', 'const REGION_NAMES = ["관동지방", "성도지방", "호연지방", "신오지방", "하나지방"];', 'regions')

          rep('src/components/MainMenu.jsx', '''  sinnoh: {\n    name: "신오지방",\n    sub: "SINNOH",\n  },\n};''', '''  sinnoh: {\n    name: "신오지방",\n    sub: "SINNOH",\n  },\n  unova: {\n    name: "하나지방",\n    sub: "UNOVA",\n  },\n};''', 'menu label')
          rep('src/components/MainMenu.jsx', '''  const sinnohUnlocked =\n    save.adminMode ||\n    (hoennLastTrainer && (save.wins?.[hoennLastTrainer.id] || 0) > 0);''', '''  const sinnohUnlocked =\n    save.adminMode ||\n    (hoennLastTrainer && (save.wins?.[hoennLastTrainer.id] || 0) > 0);\n\n  const sinnohTrainers = TRAINERS_BY_REGION.sinnoh || [];\n  const sinnohLastTrainer = sinnohTrainers[sinnohTrainers.length - 1];\n  const unovaUnlocked =\n    save.adminMode ||\n    (sinnohLastTrainer && (save.wins?.[sinnohLastTrainer.id] || 0) > 0);''', 'menu unlock')
          rep('src/components/MainMenu.jsx', '''    if (region === "sinnoh" && !sinnohUnlocked) {\n      playSfx("buzzer");\n      return;\n    }''', '''    if (region === "sinnoh" && !sinnohUnlocked) {\n      playSfx("buzzer");\n      return;\n    }\n\n    if (region === "unova" && !unovaUnlocked) {\n      playSfx("buzzer");\n      return;\n    }''', 'menu select')
          rep('src/components/MainMenu.jsx', '''              <span className="region-go">\n                {sinnohUnlocked ? "선택 ▶" : "LOCK"}\n              </span>\n            </button>\n          </div>''', '''              <span className="region-go">\n                {sinnohUnlocked ? "선택 ▶" : "LOCK"}\n              </span>\n            </button>\n            <button\n              className={[\n                "region-card",\n                !unovaUnlocked ? "region-locked" : "region-unova",\n              ].join(" ")}\n              onMouseEnter={() => unovaUnlocked && playSfx("cursor")}\n              onClick={() => selectRegion("unova")}\n            >\n              <span className="region-info">\n                <span className="region-name">하나지방</span>\n                <span className="region-sub">UNOVA</span>\n                <span className="region-desc">최상급 AI · 전용 체육관 룰</span>\n                {!unovaUnlocked && (\n                  <span className="region-lock-text">\n                    🔒 신오지방 클리어 후 해금\n                  </span>\n                )}\n              </span>\n              <span className="region-go">\n                {unovaUnlocked ? "선택 ▶" : "LOCK"}\n              </span>\n            </button>\n          </div>''', 'menu card')

          p=Path('src/components/Card.jsx'); s=p.read_text()
          old='''  const atk = effectiveAtk(unit, game);\n  const buffed = atk > unit.atk;\n  const hurt = unit.hp < unit.maxHp;'''
          new='''  const atk = effectiveAtk(unit, game);\n  const buffed = atk > unit.atk;\n  const hurt = unit.hp < unit.maxHp;\n  const ownerState = game?.players?.[unit.side];\n  const unovaSpotlight =\n    game?.trainer?.gimmick === "elesa_spotlight" &&\n    game?.turn === unit.side &&\n    ownerState?._spotlightUid === unit.uid;\n  const unovaCocoon = unit._burghCocoon === true;\n  const unovaFrost = Math.max(0, Number(unit._brycenFrost || 0));\n  const unovaAirborne = unit._skylaAirborne === true;'''
          if old not in s: raise SystemExit('card state anchor missing')
          s=s.replace(old,new,1)
          old='''          hit ? "hit-flash" : "",\n        ].join(" ")}'''
          new='''          hit ? "hit-flash" : "",\n          unovaSpotlight ? "unova-spotlight" : "",\n          unovaCocoon ? "unova-cocooned" : "",\n          unovaFrost > 0 ? "unova-frosted" : "",\n          unovaAirborne ? "unova-airborne" : "",\n        ].join(" ")}'''
          if old not in s: raise SystemExit('card class anchor missing')
          s=s.replace(old,new,1)
          old='''        {hasTaunt && <div className="taunt-badge">도발</div>}\n        {(unit.frozen > 0 || unit.status) && ('''
          new='''        {hasTaunt && <div className="taunt-badge">도발</div>}\n        {unovaSpotlight && <div className="unova-spotlight-beam" aria-hidden="true" />}\n        {unovaCocoon && (\n          <div className="unova-cocoon-overlay" aria-label="고치 상태">\n            <span>고치</span>\n          </div>\n        )}\n        {unovaFrost > 0 && (\n          <div className="unova-frost-overlay" aria-label={`냉기 ${unovaFrost}/2`}>\n            <span>❄ {unovaFrost}/2</span>\n          </div>\n        )}\n        {unovaAirborne && <div className="unova-airborne-badge">이륙</div>}\n        {(unit.frozen > 0 || unit.status) && ('''
          if old not in s: raise SystemExit('card overlay anchor missing')
          p.write_text(s.replace(old,new,1))

          p=Path('src/components/battle/SinnohBattleUi.jsx'); s=p.read_text()
          old='const GIMMICK_GUIDES = {\n'
          guides=r'''const GIMMICK_GUIDES = {
  striaton_counter: {
    fieldName: "성신 레스토랑",
    lines: ["플레이어 덱의 포켓몬 타입 구성을 분석합니다.", "덴트·팟·콘 중 플레이어 덱 전체에 평균적으로 가장 유리한 타입의 관장이 실제 상대로 등장합니다."],
    hint: "힌트: 한 타입에 지나치게 몰린 덱일수록 카운터가 선명해집니다.",
  },
  lenora_review: {
    fieldName: "칠보박물관 복습 시험",
    lines: ["플레이어 턴 종료 시 그 턴에 가장 많이 사용한 카드 종류를 기록합니다.", "다음 플레이어 턴에 기록된 종류의 첫 카드 비용이 2 증가합니다.", "분류는 포켓몬 · 기술 · 도구입니다."],
    hint: "힌트: 한 종류의 카드를 한 턴에 몰아 쓰지 말고 패턴을 섞으세요.",
  },
  burgh_cocoon: {
    fieldName: "구름체육관 우화",
    lines: ["아티의 포켓몬은 진화 전 상태로 등장한 뒤 즉시 고치화합니다.", "고치는 공격할 수 없고 받는 피해가 50% 감소합니다.", "다음 아티 턴 시작까지 살아남으면 해당 계열의 최종진화체로 즉시 우화합니다."],
    hint: "힌트: 고치 상태가 가장 확실한 제거 타이밍입니다.",
  },
  elesa_spotlight: {
    fieldName: "뇌문 스포트라이트",
    lines: ["양쪽 모두 자신의 턴 시작 시 포켓몬 하나가 무작위로 스포트라이트를 받습니다.", "그 턴에는 스포트라이트를 받은 포켓몬만 전투 공격할 수 있습니다. 기술 카드는 자유롭게 사용할 수 있습니다.", "카밀레의 시그니처 에몽가는 스포트라이트를 받으면 공격력 +2, 공격 후 손으로 돌아갑니다."],
    hint: "힌트: 공격권이 없는 포켓몬은 기술과 도구로 지원하세요.",
  },
  clay_minecart: {
    fieldName: "물풍경 광산차",
    lines: ["전투 공격으로 실제 피해를 줄 때마다 광산차가 공격한 쪽으로 1칸 움직입니다.", "야콘 쪽 +4면 플레이어 필드 전체에 땅 피해 3, 플레이어 쪽 -4면 야콘 필드 전체 피해 2가 발생합니다.", "야콘의 시그니처 몰드류는 한 번에 2칸 밉니다."],
    hint: "힌트: 기술 피해만으로는 광산차 주도권을 가져올 수 없습니다.",
  },
  skyla_airborne: {
    fieldName: "궐수 활주로",
    lines: ["풍란의 턴 종료 시 포켓몬 하나가 이륙합니다.", "이륙한 포켓몬은 다음 플레이어 턴 동안 전투 공격으로 지정할 수 없지만 기술 카드는 맞습니다.", "다음 풍란 턴 시작에 착륙하며 무작위 플레이어 포켓몬에게 비행 피해 2를 줍니다. 시그니처 스완나는 4입니다."],
    hint: "힌트: 위협적인 포켓몬이 이륙하면 기술로 공중에서 처리하세요.",
  },
  brycen_frost: {
    fieldName: "설화의 혹한",
    lines: ["얼음 타입이 아닌 포켓몬이 전투 공격할 때마다 냉기 1이 쌓입니다.", "냉기 2가 되면 공격 직후 얼음 상태가 됩니다. 한 턴 공격하지 않으면 냉기 1이 감소합니다.", "담죽의 시그니처 툰베어는 얼어 있는 포켓몬을 공격할 때 피해 +3을 얻습니다."],
    hint: "힌트: 같은 에이스만 반복 사용하지 말고 공격수를 교대하세요.",
  },
  drayden_trials: {
    fieldName: "쌍용 용의 시련",
    lines: ["매 플레이어 턴 시작 시 사간이 시련 하나를 제시합니다.", "실패하면 용의 위압이 1 증가하고 사간의 모든 드래곤 공격력이 위압만큼 증가합니다. 최대 4입니다.", "성공하면 위압이 1 감소합니다. 위압 3 이상에서 시그니처 액스라이즈는 한 턴에 두 번 공격합니다."],
    hint: "힌트: 매 턴 전투 로그의 시련을 먼저 확인하세요.",
  },
'''
          if old not in s: raise SystemExit('guide anchor missing')
          s=s.replace(old,guides,1)
          s=s.replace('if (!trainer || trainer.region !== "sinnoh" || !guide) return null;', 'if (!trainer || !["sinnoh", "unova"].includes(trainer.region) || !guide) return null;',1)
          s=s.replace('<span>신오 체육관 기믹</span>', '<span>{trainer.region === "unova" ? "하나 체육관 기믹" : "신오 체육관 기믹"}</span>',1)
          p.write_text(s)

          p=Path('src/features/battle/styles.css'); s=p.read_text()
          if '/* ===== Unova gym visual effects ===== */' not in s:
            s += r'''

/* ===== Unova gym visual effects ===== */
.field-unit.unova-cocooned .unit-art { filter: saturate(.55) brightness(.84); }
.unova-cocoon-overlay { position:absolute; z-index:9; left:50%; top:46%; width:58px; height:66px; transform:translate(-50%,-50%); pointer-events:none; background:url('/sprites/effects/unova-cocoon.svg') center/contain no-repeat; image-rendering:pixelated; filter:drop-shadow(0 4px 5px rgba(21,28,18,.5)); animation:unova-cocoon-wobble 1.8s steps(2,end) infinite; }
.unova-cocoon-overlay span { position:absolute; left:50%; bottom:-8px; transform:translateX(-50%); padding:2px 7px; border:1px solid rgba(246,239,183,.8); border-radius:999px; background:rgba(28,43,24,.9); color:#fff4b5; font-size:10px; font-weight:900; white-space:nowrap; text-shadow:0 1px 2px #000; }
@keyframes unova-cocoon-wobble { 0%,100%{transform:translate(-50%,-50%) rotate(-2deg)} 50%{transform:translate(-50%,-50%) rotate(2deg)} }
.field-unit.unova-spotlight { isolation:isolate; box-shadow:0 0 0 2px rgba(255,246,170,.9),0 0 18px rgba(255,225,95,.9),0 0 38px rgba(255,207,64,.5); }
.unova-spotlight-beam { position:absolute; z-index:7; pointer-events:none; left:50%; top:-78px; width:115px; height:148px; transform:translateX(-50%); clip-path:polygon(43% 0,57% 0,88% 100%,12% 100%); background:linear-gradient(to bottom,rgba(255,255,240,.8),rgba(255,231,107,.32) 48%,rgba(255,214,76,.06)); mix-blend-mode:screen; animation:unova-spotlight-pulse 1.05s ease-in-out infinite alternate; }
.unova-spotlight-beam::after { content:""; position:absolute; left:10%; right:10%; bottom:-8px; height:24px; border-radius:50%; border:2px solid rgba(255,242,159,.85); box-shadow:0 0 18px rgba(255,226,83,.9),inset 0 0 14px rgba(255,255,255,.6); }
@keyframes unova-spotlight-pulse { from{opacity:.72;filter:brightness(.95)} to{opacity:1;filter:brightness(1.2)} }
.field-unit.unova-frosted { box-shadow:inset 0 0 0 2px rgba(182,239,255,.75),inset 0 0 18px rgba(125,214,255,.52),0 0 13px rgba(112,213,255,.32); }
.unova-frost-overlay { position:absolute; inset:0; z-index:8; pointer-events:none; border-radius:inherit; background:radial-gradient(circle at 12% 14%,rgba(255,255,255,.95) 0 2px,transparent 3px),radial-gradient(circle at 82% 18%,rgba(211,247,255,.9) 0 2px,transparent 3px),radial-gradient(circle at 18% 77%,rgba(211,247,255,.85) 0 2px,transparent 3px),linear-gradient(135deg,rgba(210,246,255,.22),transparent 38%,rgba(125,213,255,.18)); animation:unova-frost-shimmer 1.6s ease-in-out infinite alternate; }
.unova-frost-overlay span { position:absolute; top:3px; right:4px; padding:2px 5px; border-radius:8px; background:rgba(20,76,105,.88); border:1px solid rgba(190,241,255,.8); color:#e9fbff; font-size:9px; font-weight:900; text-shadow:0 1px 2px #001d2b; }
@keyframes unova-frost-shimmer { from{opacity:.66} to{opacity:1} }
.field-unit.unova-airborne .unit-art { transform:translateY(-9px); filter:drop-shadow(0 10px 7px rgba(47,84,117,.45)); animation:unova-airborne-float 1.25s ease-in-out infinite alternate; }
.unova-airborne-badge { position:absolute; z-index:10; top:-7px; left:50%; transform:translateX(-50%); padding:2px 7px; border-radius:999px; background:rgba(70,145,203,.92); border:1px solid rgba(222,247,255,.9); color:white; font-size:9px; font-weight:900; box-shadow:0 3px 10px rgba(32,103,157,.35); }
@keyframes unova-airborne-float { from{transform:translateY(-7px)} to{transform:translateY(-13px)} }
'''
          p.write_text(s)
          PY
          npm ci
          npm run build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.jsx src/features/region-carousel/index.js src/components/MainMenu.jsx src/components/Card.jsx src/components/battle/SinnohBattleUi.jsx src/features/battle/styles.css
          git commit -m 'feat: wire Unova gyms and visual effects [unova-ui]'
          git push
