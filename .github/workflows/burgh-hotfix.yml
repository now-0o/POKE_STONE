name: Burgh hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply Burgh hotfix
        run: |
          python - <<'PY'
          from pathlib import Path

          hotfix = Path('src/engine/engine.burgh-hotfix.js')
          hotfix.write_text(r'''// 아티(구름체육관) 전용 안정화 래퍼
// - 하나지방 확장 엔진의 legacy game.logs 접근을 game.log와 연결해 AI 예외를 막는다.
// - 고치는 생성 후 두 번째 다음 아티 턴 시작에 우화하도록 지연한다.

import * as base from "./engine.js";
export * from "./engine.js";

function ensureLogAlias(game) {
  if (game && Array.isArray(game.log) && !game.logs) game.logs = game.log;
  return game;
}

export function createGame(playerDeckIds, trainer) {
  return ensureLogAlias(base.createGame(playerDeckIds, trainer));
}

export function endTurn(game) {
  ensureLogAlias(game);

  // 아티의 고치는 플레이어 턴 종료 -> 아티 턴 진입 시에만 카운트한다.
  // 첫 진입에는 우화를 숨겨 한 번 더 플레이어 대응 턴을 보장한다.
  const delayed = [];
  if (game?.trainer?.gimmick === "burgh_cocoon" && game.turn === "player") {
    for (const unit of game.players.enemy.field) {
      if (!unit?._burghCocoon || unit.hp <= 0) continue;

      if (!Number.isInteger(unit._burghCocoonTurns)) {
        unit._burghCocoonTurns = 2;
      }

      if (unit._burghCocoonTurns > 1) {
        unit._burghCocoonTurns -= 1;
        unit._burghCocoon = false;
        delayed.push(unit);
      }
    }
  }

  const result = base.endTurn(game);
  ensureLogAlias(game);

  for (const unit of delayed) {
    const current = game.players.enemy.field.find((entry) => entry.uid === unit.uid);
    if (!current || current.hp <= 0) continue;
    current._burghCocoon = true;
    current.canAttack = false;
    game.log.push(`${current.name}의 고치가 아직 단단하다. 다음 아티 턴 시작에 우화한다!`);
  }

  return result;
}
''')

          battle = Path('src/components/Battle.jsx')
          text = battle.read_text()
          old = '} from "../engine/engine.js";'
          new = '} from "../engine/engine.burgh-hotfix.js";'
          if text.count(old) != 1:
            raise SystemExit(f'Battle engine import marker count={text.count(old)}')
          battle.write_text(text.replace(old, new, 1))

          ui = Path('src/components/battle/UnovaBattleUi.jsx')
          ui_text = ui.read_text()
          old_line = '"다음 아티 턴 시작까지 살아남으면 해당 계열의 최종진화체로 바로 우화합니다. 받은 피해는 그대로 이어집니다.",'
          new_line = '"고치가 된 뒤 두 번째 다음 아티 턴 시작까지 살아남으면 해당 계열의 최종진화체로 우화합니다. 받은 피해는 그대로 이어집니다.",'
          if old_line not in ui_text:
            raise SystemExit('Burgh guide marker not found')
          ui.write_text(ui_text.replace(old_line, new_line, 1))
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit validated hotfix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/engine/engine.burgh-hotfix.js src/components/Battle.jsx src/components/battle/UnovaBattleUi.jsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: stabilize Burgh AI and delay cocoon evolution"
          git push
