name: Unova final behavior fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[unova-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply final fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('src/engine/engine.js')
          s = p.read_text()
          old = '''  // 신속이면 일반 반격 생략\n  if (!johto.extremeGuard && !expansion.noCounter) {\n    applyDamage(game, atkUnit, defDmg, defenseAttackType);\n  }\n\n  // 불비달마 - 달마모드: 공격 후 반격 피해를 받고 생존했을 때 1회 변신\n  if (\n    hasAbility(atkUnit, "zenmode") &&\n    !atkUnit._zenModeUsed &&\n    defDmg > 0 &&\n    atkUnit.hp > 0\n  ) {'''
          new = '''  // 신속이면 일반 반격 생략\n  const attackerHpBeforeCounter = atkUnit.hp;\n  if (!johto.extremeGuard && !expansion.noCounter) {\n    applyDamage(game, atkUnit, defDmg, defenseAttackType);\n  }\n  const retaliationDamageTaken = Math.max(0, attackerHpBeforeCounter - atkUnit.hp);\n\n  // 불비달마 - 달마모드: 공격 후 실제 반격 피해로 체력이 깎이고 생존했을 때 1회 변신\n  if (\n    hasAbility(atkUnit, "zenmode") &&\n    !atkUnit._zenModeUsed &&\n    retaliationDamageTaken > 0 &&\n    atkUnit.hp > 0\n  ) {'''
          if old not in s:
              raise SystemExit('zen mode anchor not found')
          p.write_text(s.replace(old, new, 1))

          up = Path('src/data/cards/unova.js')
          u = up.read_text()
          u = u.replace(
            '전기 피해 2를 준 뒤, 내 포켓몬 하나를 선택해 손으로 되돌릴 수 있다.',
            '전기 피해 2를 준 뒤, 내 필드에서 체력이 가장 낮은 포켓몬 1장을 손으로 되돌린다.',
          )
          u = u.replace(
            '불꽃 피해 2를 주고 아군 포켓몬 하나에게 이번 턴 돌진을 부여한다.',
            '불꽃 피해 2를 주고 공격력이 가장 높은 아군 포켓몬 하나에게 이번 턴 돌진을 부여한다.',
          )
          up.write_text(u)
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "poke-stone-bot"
          git config user.email "poke-stone-bot@users.noreply.github.com"
          git add src/engine/engine.js src/data/cards/unova.js
          git commit -m "fix: align final Unova card behavior [unova-final]"
          git push
