name: Cost color hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch cost state colors
        run: |
          python - <<'PY'
          from pathlib import Path

          card = Path('src/components/Card.jsx')
          text = card.read_text()
          old = '''  const discounted = cost < card.cost;'''
          new = '''  const discounted = cost < card.cost;\n  const increased = cost > card.cost;'''
          if old not in text:
            raise SystemExit('discounted marker not found')
          text = text.replace(old, new, 1)

          old = '''      <div className={`card-cost ${discounted ? "discounted" : ""}`}>'''
          new = '''      <div\n        className={`card-cost ${discounted ? "discounted" : ""} ${increased ? "increased" : ""}`}\n      >'''
          if old not in text:
            raise SystemExit('card-cost class marker not found')
          text = text.replace(old, new, 1)
          card.write_text(text)

          css = Path('src/styles.css')
          css_text = css.read_text()
          marker = '''\n/* 카드 코스트 증감 색상 구분 */\n.card-cost.discounted {\n  color: #d9fbff;\n  background: radial-gradient(circle at 35% 28%, #91f3ff, #2aa9d6 50%, #125b86 90%);\n  border-color: #a8f4ff;\n  text-shadow: 0 1px 2px rgba(0, 37, 57, 0.9), 0 0 5px rgba(90, 224, 255, 0.65);\n}\n.card-cost.increased {\n  color: #ff646f;\n  text-shadow: 0 1px 2px rgba(70, 0, 8, 0.95), 0 0 5px rgba(255, 65, 80, 0.65);\n}\n'''
          if '/* 카드 코스트 증감 색상 구분 */' not in css_text:
            css_text += marker
          css.write_text(css_text)
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit validated change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/Card.jsx src/styles.css
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: distinguish increased and reduced card costs"
          git push
