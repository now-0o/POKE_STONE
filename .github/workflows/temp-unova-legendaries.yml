name: Temporary Unova legendary abilities

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/unova-legendaries-trigger.txt'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Implement Unova legendary abilities
        run: |
          python3 <<'PY'
          from pathlib import Path

          # ------------------------------------------------------------
          # 1) Card data / ability text
          # ------------------------------------------------------------
          p = Path('src/data/cards/unova.js')
          text = p.read_text()
          replacements = {
            'P("cobalion", "코바르온", "강철", 7, 8, 9, "L", { ability: "justified" })': 'P("cobalion", "코바르온", "강철", 7, 8, 9, "L", { ability: "quickguard" })',
            'P("terrakion", "테라키온", "바위", 7, 10, 7, "L", { ability: "justified" })': 'P("terrakion", "테라키온", "바위", 7, 10, 7, "L", { ability: "retaliate" })',
            'P("virizion", "비리디온", "풀", 7, 8, 9, "L", { ability: "justified" })': 'P("virizion", "비리디온", "풀", 7, 8, 9, "L", { ability: "worryseed" })',
            'P("tornadus", "토네로스", "비행", 7, 9, 8, "L", { ability: "prankster" })': 'P("tornadus", "토네로스", "비행", 7, 9, 8, "L", { ability: "tailwind" })',
            'P("thundurus", "볼트로스", "전기", 7, 9, 8, "L", { ability: "prankster" })': 'P("thundurus", "볼트로스", "전기", 7, 9, 8, "L", { ability: "charge" })',
            'P("landorus", "랜드로스", "땅", 7, 9, 8, "L", { ability: "sandforce" })': 'P("landorus", "랜드로스", "땅", 7, 9, 8, "L", { ability: "gravity" })',
            'P("kyurem", "큐레무", "얼음", 8, 9, 9, "L", { ability: "pressure" })': 'P("kyurem", "큐레무", "얼음", 8, 9, 9, "L", { ability: "glaciate" })',
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'card definition not found: {old[:40]}')
            text = text.replace(old, new, 1)

          marker = '  justified: "정의의마음: 악 타입 피해를 받으면 공격력 +1.",\n'
          ability_lines = '''  quickguard: "퍼스트가드: 상대 턴마다 처음으로 다른 아군 포켓몬이 기본 공격 또는 단일 대상 기술의 대상이 되면 대신 대상이 되고, 그 피해를 2 줄인다.",
  retaliate: "원수갚기: 이 카드가 손에 있을 때 아군 포켓몬이 기절하면 다음 내 턴 동안 비용 -3, 돌진을 얻는다.",
  worryseed: "고민씨: 나왔을 때 상대 포켓몬 하나를 선택한다. 비리디온이 필드에 있는 동안 그 포켓몬의 특성을 비활성화한다.",
  tailwind: "순풍: 필드에 있는 동안 매 내 턴 처음 내는 다른 포켓몬의 비용 -2. 그 포켓몬은 그 턴 즉시 공격할 수 있다.",
  charge: "충전: 내 턴 종료 시 남은 에너지를 최대 3 저장한다. 다음 내 턴 시작 시 저장한 만큼 추가 에너지를 얻는다.",
  gravity: "중력: 필드에 있는 동안 상대 카드의 비용은 원래 비용보다 낮아질 수 없다. 아군의 땅 타입 공격은 비행·부유·풍선의 땅 면역을 무시한다.",
  glaciate: "얼어붙은세계: 나왔을 때 상대 손패를 공개하고 카드 2장을 선택해 봉인한다. 큐레무가 필드에 있는 동안 봉인된 카드는 사용할 수 없다.",
'''
          if marker not in text:
            raise SystemExit('unova ability marker not found')
          text = text.replace(marker, marker + ability_lines, 1)
          p.write_text(text)

          # ------------------------------------------------------------
          # 2) Engine wrapper
          # ------------------------------------------------------------
          p = Path('src/engine/engine.js')
          text = p.read_text()

          helper_marker = 'function protectCocoons(game) {'
          helpers = r'''
function battleTurnKey(game) {
  return `${game?.turnCount || 0}:${game?.turn || ""}`;
}

function fieldHasAbility(game, side, ability) {
  return !!game?.players?.[side]?.field?.some(
    (unit) => unit?.hp > 0 && hasAbility(unit, ability),
  );
}

function gravityLocksCost(game, side) {
  return fieldHasAbility(game, base.other(side), "gravity");
}

function tailwindEligible(game, side, card) {
  if (!card || card.kind !== "pokemon" || card.id === "tornadus") return false;
  if (game?.turn !== side) return false;
  if (!fieldHasAbility(game, side, "tailwind")) return false;
  return game.players[side]._tailwindUsedTurnKey !== battleTurnKey(game);
}

function extendedEffectiveCost(card, game, side, handCard = null) {
  if (!card) return 0;
  let cost = base.effectiveCost(card, game, side, handCard);
  cost += lenoraExtraCost(card, game, side);
  if (tailwindEligible(game, side, card)) cost -= 2;
  if (gravityLocksCost(game, side)) cost = Math.max(card.cost, cost);
  return Math.max(0, cost);
}

function withForcedBaseCost(card, game, side, handCard, desiredCost, fn) {
  if (!card || !handCard) return fn();
  const hadReduction = Object.prototype.hasOwnProperty.call(handCard, "costReduction");
  const originalReduction = handCard.costReduction;
  const baseCost = base.effectiveCost(card, game, side, handCard);
  handCard.costReduction = (Number(originalReduction) || 0) + (baseCost - desiredCost);
  try {
    return fn();
  } finally {
    if (hadReduction) handCard.costReduction = originalReduction;
    else delete handCard.costReduction;
  }
}

function isGlaciateSealed(game, side, handCard) {
  const sourceUid = handCard?._glaciateSealedByUid;
  if (!sourceUid) return false;
  const source = game.players?.[base.other(side)]?.field?.find(
    (unit) => unit.uid === sourceUid && unit.hp > 0 && hasAbility(unit, "glaciate"),
  );
  if (source) return true;
  delete handCard._glaciateSealedByUid;
  return false;
}

function snapshotLivingUnits(game) {
  return {
    player: new Set((game.players?.player?.field || []).filter((u) => u.hp > 0).map((u) => u.uid)),
    enemy: new Set((game.players?.enemy?.field || []).filter((u) => u.hp > 0).map((u) => u.uid)),
  };
}

function armRetaliateFromDeaths(game, before) {
  if (!before) return;
  for (const side of ["player", "enemy"]) {
    const p = game.players?.[side];
    if (!p) continue;
    const died = [...(before[side] || [])].some(
      (uid) => !p.field.some((unit) => unit.uid === uid && unit.hp > 0),
    );
    if (!died) continue;
    const armed = p.hand.filter((handCard) => handCard.cardId === "terrakion");
    let newlyArmed = false;
    for (const handCard of armed) {
      if (!handCard._retaliatePending) newlyArmed = true;
      handCard._retaliatePending = true;
    }
    if (newlyArmed) game.log.push("테라키온의 원수갚기! 다음 내 턴을 기다린다.");
  }
}

function activateRetaliateForTurn(game, side) {
  const p = game.players?.[side];
  if (!p) return;
  for (const handCard of p.hand) {
    if (handCard.cardId !== "terrakion" || !handCard._retaliatePending) continue;
    handCard._retaliateHadReduction = Object.prototype.hasOwnProperty.call(handCard, "costReduction");
    handCard._retaliateBaseReduction = handCard.costReduction;
    handCard.costReduction = (Number(handCard.costReduction) || 0) + 3;
    handCard._retaliateReduction = 3;
    handCard._retaliateRush = true;
    delete handCard._retaliatePending;
    game.log.push("테라키온의 원수갚기! 이번 턴 비용 -3, 돌진!");
  }
}

function clearRetaliateForEndingTurn(game, side) {
  const p = game.players?.[side];
  if (!p) return;
  for (const handCard of p.hand) {
    if (!handCard._retaliateRush) continue;
    if (handCard._retaliateHadReduction) {
      handCard.costReduction = handCard._retaliateBaseReduction;
    } else {
      delete handCard.costReduction;
    }
    delete handCard._retaliateHadReduction;
    delete handCard._retaliateBaseReduction;
    delete handCard._retaliateReduction;
    delete handCard._retaliateRush;
  }
}

function refreshWorrySeedSuppression(game) {
  const allUnits = [
    ...(game.players?.player?.field || []),
    ...(game.players?.enemy?.field || []),
  ];
  for (const unit of allUnits) {
    if (!unit?._worrySeedSourceUid) continue;
    const source = allUnits.find(
      (candidate) =>
        candidate.uid === unit._worrySeedSourceUid &&
        candidate.hp > 0 &&
        hasAbility(candidate, "worryseed"),
    );
    if (source) {
      if (unit.ability !== null || unit.secondaryAbility !== null) {
        unit._worrySeedStoredAbility = unit.ability;
        unit._worrySeedStoredSecondaryAbility = unit.secondaryAbility;
      }
      unit.ability = null;
      unit.secondaryAbility = null;
      continue;
    }
    unit.ability = unit._worrySeedStoredAbility ?? null;
    unit.secondaryAbility = unit._worrySeedStoredSecondaryAbility ?? null;
    delete unit._worrySeedStoredAbility;
    delete unit._worrySeedStoredSecondaryAbility;
    delete unit._worrySeedSourceUid;
  }
}

function applyWorrySeedTarget(game, source, target) {
  if (!source || !target || target.hp <= 0) return false;
  target._worrySeedStoredAbility = target.ability;
  target._worrySeedStoredSecondaryAbility = target.secondaryAbility;
  target._worrySeedSourceUid = source.uid;
  target.ability = null;
  target.secondaryAbility = null;
  game.log.push(`${source.name}의 고민씨! ${target.name}의 특성이 봉인됐다!`);
  return true;
}

function firstGuardCandidate(game, attackingSide, targetUid) {
  if (!targetUid || targetUid === "hero") return null;
  const defendingSide = base.other(attackingSide);
  const defender = game.players?.[defendingSide];
  const originalTarget = defender?.field?.find((u) => u.uid === targetUid && u.hp > 0);
  if (!originalTarget) return null;
  const key = battleTurnKey(game);
  return defender.field.find(
    (unit) =>
      unit.uid !== originalTarget.uid &&
      unit.hp > 0 &&
      hasAbility(unit, "quickguard") &&
      unit._quickGuardUsedTurnKey !== key,
  ) || null;
}

function markFirstGuardUsed(game, guard) {
  if (!guard) return;
  guard._quickGuardUsedTurnKey = battleTurnKey(game);
  game.log.push(`${guard.name}의 퍼스트가드! 아군 대신 공격을 받아냈다!`);
}

function withFirstGuardShield(guard, fn) {
  if (!guard) return fn();
  const originalMaxHp = guard.maxHp;
  guard.maxHp += 2;
  guard.hp += 2;
  try {
    return fn();
  } finally {
    guard.maxHp = originalMaxHp;
    guard.hp = Math.min(guard.hp, originalMaxHp);
  }
}

function withGravityGrounding(game, side, sourceType, fn) {
  if (sourceType !== "땅" || !fieldHasAbility(game, side, "gravity")) return fn();
  const foe = game.players?.[base.other(side)];
  if (!foe) return fn();
  const snapshots = foe.field.map((unit) => ({
    unit,
    type: unit.type,
    ability: unit.ability,
    secondaryAbility: unit.secondaryAbility,
    item: unit.item,
  }));
  for (const snap of snapshots) {
    const unit = snap.unit;
    if (unit.type === "비행") unit.type = "노말";
    if (unit.ability === "levitate") unit.ability = null;
    if (unit.secondaryAbility === "levitate") unit.secondaryAbility = null;
    if (unit.item === "air_balloon") unit.item = null;
  }
  try {
    return fn();
  } finally {
    for (const snap of snapshots) {
      snap.unit.type = snap.type;
      snap.unit.ability = snap.ability;
      snap.unit.secondaryAbility = snap.secondaryAbility;
      snap.unit.item = snap.item;
    }
  }
}

function findPlayedPokemonUnit(player, card, target, beforeUids) {
  if (!player || card?.kind !== "pokemon") return null;
  if (card.evolvesFrom && target?.uid) {
    return player.field.find((unit) => unit.uid === target.uid) || null;
  }
  return player.field.find((unit) => !beforeUids.has(unit.uid)) || null;
}

function setupVirizionBattlecry(game, side, unit) {
  const foe = game.players[base.other(side)];
  const targets = foe.field.filter((target) => target.hp > 0);
  if (!targets.length) return;
  if (side === "player") {
    game.pendingBattlecry = {
      side,
      uid: unit.uid,
      ability: "worryseed",
      targetSide: "enemy",
      targets: targets.map((target) => target.uid),
    };
    game.log.push("비리디온의 고민씨! 특성을 봉인할 상대를 선택하세요.");
    return;
  }
  const target = [...targets].sort((a, b) => {
    const costDiff = (CARD_MAP[b.cardId]?.cost || 0) - (CARD_MAP[a.cardId]?.cost || 0);
    if (costDiff) return costDiff;
    return effectiveAtk(b, game) - effectiveAtk(a, game);
  })[0];
  applyWorrySeedTarget(game, unit, target);
}

function setupKyuremBattlecry(game, side, unit) {
  const targetSide = base.other(side);
  const foe = game.players[targetSide];
  const targets = foe.hand.filter((handCard) => !isGlaciateSealed(game, targetSide, handCard));
  const count = Math.min(2, targets.length);
  if (!count) return;
  if (side === "player") {
    game.pendingGlaciate = {
      side,
      uid: unit.uid,
      targetSide,
      count,
      targets: targets.map((handCard) => handCard.uid),
      selected: [],
    };
    game.log.push(`큐레무의 얼어붙은세계! 상대 손패에서 ${count}장을 봉인하세요.`);
    return;
  }
  const picks = [...targets]
    .sort((a, b) => (CARD_MAP[b.cardId]?.cost || 0) - (CARD_MAP[a.cardId]?.cost || 0))
    .slice(0, count);
  for (const handCard of picks) handCard._glaciateSealedByUid = unit.uid;
  game.log.push(`큐레무의 얼어붙은세계! 내 손패 ${count}장이 봉인됐다!`);
}

function setupNewLegendaryAbility(game, side, unit) {
  if (!unit || unit.hp <= 0) return;
  if (hasAbility(unit, "worryseed")) setupVirizionBattlecry(game, side, unit);
  if (hasAbility(unit, "glaciate")) setupKyuremBattlecry(game, side, unit);
}

function storeChargeEnergy(game, side) {
  const p = game.players?.[side];
  if (!p || !fieldHasAbility(game, side, "charge")) return;
  const amount = Math.min(3, Math.max(0, p.mana || 0));
  p._chargeStoredEnergy = amount;
  if (amount > 0) game.log.push(`볼트로스의 충전! 에너지 ${amount}을 저장했다!`);
}

function releaseChargeEnergy(game, side) {
  const p = game.players?.[side];
  const amount = Math.max(0, p?._chargeStoredEnergy || 0);
  if (!p || amount <= 0) return;
  p.mana += amount;
  p._chargeStoredEnergy = 0;
  game.log.push(`볼트로스의 충전! 저장한 에너지 ${amount}을 추가로 얻었다!`);
}

'''
          if helper_marker not in text:
            raise SystemExit('engine helper marker not found')
          text = text.replace(helper_marker, helpers + helper_marker, 1)

          # Upgrade eject wrapper so custom death/suppression state stays in sync.
          old = '''function runBaseActionWithEject(game, action) {
  const snapshot = snapshotFieldHp(game);
  const result = action();
  resolveImmediateEjectButtons(game, snapshot);
  syncUnovaState(game);
  return result;
}'''
          new = '''function runBaseActionWithEject(game, action) {
  const snapshot = snapshotFieldHp(game);
  const livingSnapshot = snapshotLivingUnits(game);
  const result = action();
  resolveImmediateEjectButtons(game, snapshot);
  armRetaliateFromDeaths(game, livingSnapshot);
  refreshWorrySeedSuppression(game);
  syncUnovaState(game);
  return result;
}'''
          if old not in text:
            raise SystemExit('runBaseActionWithEject block not found')
          text = text.replace(old, new, 1)

          old = '''export function effectiveCost(card, game, side, handCard = null) {
  return base.effectiveCost(card, game, side, handCard) + lenoraExtraCost(card, game, side);
}'''
          new = '''export function effectiveCost(card, game, side, handCard = null) {
  return extendedEffectiveCost(card, game, side, handCard);
}'''
          if old not in text:
            raise SystemExit('effectiveCost wrapper not found')
          text = text.replace(old, new, 1)

          old_start = text.index('export function canPlayCard(game, side, handIdx) {')
          old_end = text.index('\nexport function playCard(', old_start)
          new_canplay = '''export function canPlayCard(game, side, handIdx) {
  refreshWorrySeedSuppression(game);
  const handCard = game.players?.[side]?.hand?.[handIdx];
  const card = CARD_MAP[handCard?.cardId];
  if (!handCard || !card || isGlaciateSealed(game, side, handCard)) return false;
  const desiredCost = extendedEffectiveCost(card, game, side, handCard);
  return withForcedBaseCost(card, game, side, handCard, desiredCost, () =>
    base.canPlayCard(game, side, handIdx),
  );
}
'''
          text = text[:old_start] + new_canplay + text[old_end:]

          play_start = text.index('export function playCard(game, side, handIdx, target = null, fieldIndex = null) {')
          play_end = text.index('\nexport function canAttack(', play_start)
          new_play = r'''export function playCard(game, side, handIdx, target = null, fieldIndex = null) {
  refreshWorrySeedSuppression(game);
  const damageSnapshot = snapshotFieldHp(game);
  const livingSnapshot = snapshotLivingUnits(game);
  const player = game.players?.[side];
  const handCard = player?.hand?.[handIdx];
  const card = CARD_MAP[handCard?.cardId];
  if (!handCard || !card || isGlaciateSealed(game, side, handCard)) return false;

  const beforeUids = new Set((player?.field || []).map((u) => u.uid));
  const desiredCost = extendedEffectiveCost(card, game, side, handCard);
  const tailwindTriggered = tailwindEligible(game, side, card);
  const retaliateRush = card.id === "terrakion" && !!handCard._retaliateRush;
  const canQuickGuard =
    card.kind === "spell" &&
    card.type === "기술" &&
    base.spellNeedsTarget(card) === "enemy" &&
    target?.uid &&
    target.uid !== "hero";
  const quickGuard = canQuickGuard
    ? firstGuardCandidate(game, side, target.uid)
    : null;
  const resolvedTarget = quickGuard ? { ...target, uid: quickGuard.uid } : target;
  const cocoonSnapshots = side === "player" ? protectCocoons(game) : [];
  const sourceType = card.moveType || (card.kind === "pokemon" ? card.type : null);

  const result = withFirstGuardShield(quickGuard, () =>
    withGravityGrounding(game, side, sourceType, () =>
      withForcedBaseCost(card, game, side, handCard, desiredCost, () =>
        base.playCard(game, side, handIdx, resolvedTarget, fieldIndex),
      ),
    ),
  );

  normalizeCocoons(game, cocoonSnapshots);

  if (result) {
    if (quickGuard) markFirstGuardUsed(game, quickGuard);

    if (side === "player" && game.trainer?.gimmick === "lenora_review") {
      const p = game.players.player;
      const kind = reviewCardKind(card);
      if (kind) {
        p._reviewKindsThisTurn = p._reviewKindsThisTurn || {};
        p._reviewKindsThisTurn[kind] = (p._reviewKindsThisTurn[kind] || 0) + 1;
        p._reviewUseSequence = p._reviewUseSequence || [];
        p._reviewUseSequence.push(kind);
      }
    }

    if (
      side === "player" &&
      game.trainer?.gimmick === "drayden_trials" &&
      card?.kind === "spell" &&
      card.type === "기술"
    ) {
      game.players.player._draydenTechniqueUsed = true;
    }

    markBurghCocoon(game, side, card, beforeUids);

    const playedUnit = findPlayedPokemonUnit(player, card, target, beforeUids);
    if (tailwindTriggered) {
      player._tailwindUsedTurnKey = battleTurnKey(game);
      if (playedUnit) {
        playedUnit.canAttack = true;
        game.log.push(`토네로스의 순풍! ${playedUnit.name}이(가) 즉시 공격할 수 있다!`);
      }
    }
    if (retaliateRush && playedUnit) {
      playedUnit.canAttack = true;
      game.log.push(`${playedUnit.name}의 원수갚기! 즉시 공격할 수 있다!`);
    }
    if (playedUnit) setupNewLegendaryAbility(game, side, playedUnit);
  }

  resolveImmediateEjectButtons(game, damageSnapshot);
  armRetaliateFromDeaths(game, livingSnapshot);
  refreshWorrySeedSuppression(game);
  syncUnovaState(game);
  return result;
}
'''
          text = text[:play_start] + new_play + text[play_end:]

          # Attack: death tracking, Quick Guard redirect, Gravity grounding.
          old = '''export function attack(game, side, attackerUid, target) {
  const damageSnapshot = snapshotFieldHp(game);
  const attacker = game.players?.[side]?.field?.find((u) => u.uid === attackerUid);
  if (!attacker || !canAttack(game, side, attackerUid)) return false;

  const targetSide = side === "player" ? "enemy" : "player";'''
          new = '''export function attack(game, side, attackerUid, target) {
  refreshWorrySeedSuppression(game);
  const damageSnapshot = snapshotFieldHp(game);
  const livingSnapshot = snapshotLivingUnits(game);
  const attacker = game.players?.[side]?.field?.find((u) => u.uid === attackerUid);
  if (!attacker || !canAttack(game, side, attackerUid)) return false;

  const quickGuard = firstGuardCandidate(game, side, target?.uid);
  if (quickGuard) target = { ...target, uid: quickGuard.uid };

  const targetSide = side === "player" ? "enemy" : "player";'''
