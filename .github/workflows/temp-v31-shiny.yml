name: Temporary v3.1 shiny update

on:
  push:
    branches: [main]
    paths:
      - '.github/v31-shiny-trigger.txt'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply v3.1 update
        run: |
          python3 <<'PY'
          from pathlib import Path

          shiny = Path('src/state/shiny.js')
          text = shiny.read_text()
          old = 'export const SHINY_DUPLICATE_CHANCE = 0.05;'
          new = 'export const SHINY_DUPLICATE_CHANCE = 0.01;'
          if old not in text:
              raise SystemExit('shiny chance line not found')
          shiny.write_text(text.replace(old, new, 1))

          pack = Path('src/components/PackShop.jsx')
          text = pack.read_text()
          old = '            5% 확률로 이로치가 되며, 초과 일반 카드는 자동 환급돼요.'
          new = '            1% 확률로 이로치가 되며, 초과 일반 카드는 자동 환급돼요.'
          if old not in text:
              raise SystemExit('pack shiny chance text not found')
          pack.write_text(text.replace(old, new, 1))

          v31 = Path('src/features/patch-notes/v31.js')
          v31.write_text('''export const PATCH_NOTE_V31 = {\n  version: "3.1",\n  date: "2026-08-20",\n  title: "이로치 시스템 업데이트",\n  changes: [\n    "카드팩에서 이미 보유한 포켓몬이 다시 등장할 때 낮은 확률로 이로치 카드를 획득할 수 있습니다.",\n    "획득한 이로치는 컬렉션과 덱에서 일반 카드와 별도로 선택해 사용할 수 있습니다.",\n  ],\n};\n''')

          index = Path('src/features/patch-notes/index.js')
          text = index.read_text()
          if 'PATCH_NOTE_V31' not in text:
              text = text.replace(
                  'import { PATCH_NOTE_V30 } from "./v30.js";\n',
                  'import { PATCH_NOTE_V30 } from "./v30.js";\nimport { PATCH_NOTE_V31 } from "./v31.js";\n',
                  1,
              )
              text = text.replace(
                  'export const ALL_PATCH_NOTES = [\n  PATCH_NOTE_V30,',
                  'export const ALL_PATCH_NOTES = [\n  PATCH_NOTE_V31,\n  PATCH_NOTE_V30,',
                  1,
              )
          index.write_text(text)
          PY
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit source changes
        run: |
          git config user.name "poke-stone-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/state/shiny.js src/components/PackShop.jsx src/features/patch-notes/index.js src/features/patch-notes/v31.js
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "feat: add v3.1 shiny patch note and lower shiny chance"
          git push origin main
