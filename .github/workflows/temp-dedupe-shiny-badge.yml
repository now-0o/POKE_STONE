name: Temporary dedupe shiny badge

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/dedupe-shiny-badge-trigger.txt'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Keep one shiny badge
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/components/Card.jsx')
          text = p.read_text()
          double = '''      {shownShiny && <div className="shiny-badge">이로치</div>}\n\n      {shownShiny && <div className="shiny-badge">이로치</div>}'''
          single = '''      {shownShiny && <div className="shiny-badge">이로치</div>}'''
          if double not in text:
              raise SystemExit('duplicate shiny badge block not found')
          p.write_text(text.replace(double, single, 1))
          PY
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit source change
        run: |
          git config user.name "poke-stone-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/Card.jsx
          git commit -m "fix: render one shiny badge"
          git push origin HEAD:${{ github.head_ref }}
