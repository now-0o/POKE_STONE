name: Temporary restore shiny badge

on:
  push:
    branches: [main]
    paths:
      - '.github/restore-shiny-badge-trigger.txt'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Restore shiny badge without emoji
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/components/Card.jsx')
          text = p.read_text()
          old = '''      <div className="card-topline">\n        <span className="card-name">{shownName}</span>\n      </div>'''
          new = '''      {shownShiny && <div className="shiny-badge">이로치</div>}\n\n      <div className="card-topline">\n        <span className="card-name">{shownName}</span>\n      </div>'''
          if old not in text:
              raise SystemExit('card topline block not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit source change
        run: |
          git config user.name "poke-stone-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/Card.jsx
          git commit -m "fix: restore shiny badge without emoji"
          git push origin main
