name: Apply Clay minecart update

on:
  push:
    paths:
      - '.github/workflows/clay-minecart-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch Clay minecart
        run: |
          python - <<'PY'
          from pathlib import Path

          # ---- engine: 9 positions -> 7, add one-shot burst state ----
          p = Path('src/engine/engine.js')
          s = p.read_text()
          old = '''function advanceMinecart(game, side, steps) {
  if (game?.trainer?.gimmick !== "clay_minecart") return;
  const direction = side === "enemy" ? 1 : -1;
  game._clayMinecart = Math.max(-4, Math.min(4, (game._clayMinecart || 0) + direction * steps));
  game.log.push(`광산차 게이지 ${game._clayMinecart > 0 ? "+" : ""}${game._clayMinecart}!`);

  if (game._clayMinecart >= 4) {
    for (const unit of game.players.player.field) minecartGroundDamage(game, unit, 3);
    game.log.push("광산차가 야콘 쪽 끝에 닿았다! 낙반! 플레이어 필드 전체에 땅 피해 3!");
    game._clayMinecart = 0;
    base.cleanupDeaths(game);
  } else if (game._clayMinecart <= -4) {
    for (const unit of game.players.enemy.field) {
      if (unit.hp > 0) unit.hp = Math.max(0, unit.hp - 2);
    }
    game.log.push("광산차를 역으로 밀어냈다! 광맥 붕괴! 야콘 필드 전체 피해 2!");
    game._clayMinecart = 0;
    base.cleanupDeaths(game);
  }
}'''
          new = '''function advanceMinecart(game, side, steps) {
  if (game?.trainer?.gimmick !== "clay_minecart") return;
  const direction = side === "enemy" ? 1 : -1;
  // 중앙 포함 7칸: -3 ~ +3. 양 끝에 닿는 즉시 폭발하고 중앙으로 복귀한다.
  game._clayMinecart = Math.max(-3, Math.min(3, (game._clayMinecart || 0) + direction * steps));
  game.log.push(`광산차 게이지 ${game._clayMinecart > 0 ? "+" : ""}${game._clayMinecart}!`);

  if (game._clayMinecart >= 3) {
    for (const unit of game.players.player.field) minecartGroundDamage(game, unit, 3);
    game._clayMinecartBurstSeq = (game._clayMinecartBurstSeq || 0) + 1;
    game._clayMinecartBurst = {
      id: game._clayMinecartBurstSeq,
      targetSide: "player",
      amount: 3,
      damageType: "ground",
    };
    game.log.push("광산차가 야콘 쪽 끝에 닿았다! 낙반! 플레이어 필드 전체에 땅 피해 3!");
    game._clayMinecart = 0;
    base.cleanupDeaths(game);
  } else if (game._clayMinecart <= -3) {
    for (const unit of game.players.enemy.field) {
      if (unit.hp > 0) unit.hp = Math.max(0, unit.hp - 2);
    }
    game._clayMinecartBurstSeq = (game._clayMinecartBurstSeq || 0) + 1;
    game._clayMinecartBurst = {
      id: game._clayMinecartBurstSeq,
      targetSide: "enemy",
      amount: 2,
      damageType: "fixed",
    };
    game.log.push("광산차를 역으로 밀어냈다! 광맥 붕괴! 야콘 필드 전체 피해 2!");
    game._clayMinecart = 0;
    base.cleanupDeaths(game);
  }
}'''
          assert old in s, 'advanceMinecart block not found'
          s = s.replace(old, new, 1)

          old = '''    minecart: game._clayMinecart || 0,
    draydenTrial: game._draydenTrialText || null,'''
          new = '''    minecart: game._clayMinecart || 0,
    minecartBurst: game._clayMinecartBurst || null,
    draydenTrial: game._draydenTrialText || null,'''
          assert old in s, 'sync state minecart block not found'
          s = s.replace(old, new, 1)

          old = '''  if (game.trainer?.gimmick === "clay_minecart") game._clayMinecart = 0;'''
          new = '''  if (game.trainer?.gimmick === "clay_minecart") {
    game._clayMinecart = 0;
    game._clayMinecartBurst = null;
    game._clayMinecartBurstSeq = 0;
  }'''
          assert old in s, 'Clay createGame init not found'
          s = s.replace(old, new, 1)
          p.write_text(s)

          # ---- UI: 7 positions, updated guide, burst animation hook ----
          p = Path('src/components/battle/UnovaBattleUi.jsx')
          s = p.read_text()
          s = s.replace(
            '"야콘 쪽 +4에 도달하면 플레이어 필드 전체에 땅 피해 3, 플레이어 쪽 -4에 도달하면 야콘 필드 전체에 피해 2가 발생하고 중앙으로 돌아옵니다.",',
            '"야콘 쪽 +3에 도달하면 플레이어 필드 전체에 땅 피해 3, 플레이어 쪽 -3에 도달하면 야콘 필드 전체에 피해 2가 발생하고 중앙으로 돌아옵니다.",',
            1,
          )
          s = s.replace(
            '''    minecart: 0,
    draydenTrial: null,''',
            '''    minecart: 0,
    minecartBurst: null,
    draydenTrial: null,''',
            1,
          )
          old = '''function MinecartHud({ value = 0 }) {
  const positions = [-4, -3, -2, -1, 0, 1, 2, 3, 4];
  return (
    <div className="unova-minecart-hud" aria-live="polite">
      <div className="unova-hud-title">⛏️ 광산차</div>
      <div className="unova-minecart-labels">
        <span>플레이어</span>
        <strong>{value > 0 ? `+${value}` : value}</strong>
        <span>야콘</span>
      </div>
      <div className="unova-minecart-track">
        {positions.map((position) => (
          <span
            key={position}
            className={position === value ? "active" : ""}
            aria-label={`광산차 ${position}`}
          >
            {position === value ? "▣" : "·"}
          </span>
        ))}
      </div>
    </div>
  );
}'''
          new = '''function MinecartHud({ value = 0, burst = null }) {
  const positions = [-3, -2, -1, 0, 1, 2, 3];
  const [burstFx, setBurstFx] = useState(null);

  useEffect(() => {
    if (!burst?.id) return undefined;

    setBurstFx(burst);
    const board = document.querySelector(".battle.battle-board");
    const field = board?.querySelector(
      burst.targetSide === "player" ? ".my-field" : ".enemy-field",
    );
    const selector =
      burst.targetSide === "player"
        ? '.field-unit[data-drop="unit-player"]'
        : '.field-unit[data-drop="unit-enemy"]';
    const units = board ? [...board.querySelectorAll(selector)] : [];

    units.forEach((unit) => unit.classList.add("unova-minecart-damage-hit"));

    let impact = null;
    if (board && field) {
      const boardRect = board.getBoundingClientRect();
      const fieldRect = field.getBoundingClientRect();
      impact = document.createElement("div");
      impact.className = `unova-minecart-impact-fx target-${burst.targetSide}`;
      impact.setAttribute("aria-hidden", "true");
      impact.style.left = `${fieldRect.left - boardRect.left + fieldRect.width / 2}px`;
      impact.style.top = `${fieldRect.top - boardRect.top + fieldRect.height / 2}px`;
      impact.style.width = `${Math.max(220, fieldRect.width * 0.72)}px`;
      impact.innerHTML = `
        <div class="unova-minecart-impact-ring"></div>
        <div class="unova-minecart-impact-dust"></div>
        <strong>${burst.targetSide === "player" ? "낙반!" : "광맥 붕괴!"}</strong>
        <span>${burst.targetSide === "player" ? "땅 피해 3" : "전체 피해 2"}</span>
      `;
      board.appendChild(impact);
    }

    const timer = window.setTimeout(() => {
      setBurstFx(null);
      units.forEach((unit) => unit.classList.remove("unova-minecart-damage-hit"));
      impact?.remove();
    }, 920);

    return () => {
      window.clearTimeout(timer);
      units.forEach((unit) => unit.classList.remove("unova-minecart-damage-hit"));
      impact?.remove();
    };
  }, [burst?.id]);

  return (
    <div
      className={`unova-minecart-hud ${burstFx ? `is-bursting burst-${burstFx.targetSide}` : ""}`}
      aria-live="polite"
    >
      <div className="unova-hud-title">⛏️ 광산차</div>
      <div className="unova-minecart-labels">
        <span>플레이어</span>
        <strong>{value > 0 ? `+${value}` : value}</strong>
        <span>야콘</span>
      </div>
      <div className="unova-minecart-track">
        {positions.map((position) => (
          <span
            key={position}
            className={position === value ? "active" : ""}
            aria-label={`광산차 ${position}`}
          >
            {position === value ? "▣" : "·"}
          </span>
        ))}
      </div>
      {burstFx && (
        <div className="unova-minecart-burst-label" aria-hidden="true">
          {burstFx.targetSide === "player" ? "쾅! 낙반" : "쾅! 광맥 붕괴"}
        </div>
      )}
    </div>
  );
}'''
          assert old in s, 'MinecartHud block not found'
          s = s.replace(old, new, 1)
          old = '''        <MinecartHud value={gymState.minecart || 0} />'''
          new = '''        <MinecartHud
          value={gymState.minecart || 0}
          burst={gymState.minecartBurst || null}
        />'''
          assert old in s, 'MinecartHud render not found'
          s = s.replace(old, new, 1)
          p.write_text(s)

          # ---- CSS: compact top-left HUD + impact animation ----
          p = Path('src/styles/unova-battle.css')
          s = p.read_text()
          s = s.replace('''  grid-template-columns: repeat(9, 1fr);''', '''  grid-template-columns: repeat(7, 1fr);''', 1)

          marker = '''/* 사간 HUD */'''
          extra = r'''
/* 야콘 광산차는 필드 중앙을 가리지 않도록 작게 좌측 상단에 둔다. */
.unova-minecart-hud {
  z-index: 180;
  left: 14px;
  top: 76px;
  transform: none;
  width: min(220px, calc(100vw - 28px));
  min-width: 0;
  padding: 6px 9px 7px;
  border-radius: 10px;
  backdrop-filter: blur(6px);
}

.unova-minecart-hud .unova-hud-title {
  margin-bottom: 2px;
  font-size: 9px;
}

.unova-minecart-hud .unova-minecart-labels {
  gap: 6px;
  font-size: 9px;
}

.unova-minecart-hud .unova-minecart-labels strong {
  font-size: 11px;
}

.unova-minecart-hud .unova-minecart-track {
  margin-top: 3px;
  height: 15px;
}

.unova-minecart-hud .unova-minecart-track span {
  font-size: 10px;
}

.unova-minecart-hud .unova-minecart-track span.active {
  font-size: 13px;
}

.unova-minecart-hud.is-bursting {
  animation: unova-minecart-hud-impact .62s cubic-bezier(.18,.75,.2,1) both;
}

.unova-minecart-burst-label {
  position: absolute;
  left: 50%;
  top: 100%;
  transform: translate(-50%, 3px);
  padding: 3px 8px;
  border-radius: 999px;
  background: rgba(52, 31, 17, .94);
  border: 1px solid rgba(255, 202, 112, .8);
  color: #ffe1a2;
  font-size: 9px;
  font-weight: 900;
  white-space: nowrap;
  box-shadow: 0 4px 12px rgba(0,0,0,.32);
  animation: unova-minecart-burst-label .85s ease-out both;
}

.unova-minecart-impact-fx {
  position: absolute;
  z-index: 140;
  height: 118px;
  transform: translate(-50%, -50%);
  pointer-events: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #fff0c7;
  text-align: center;
  text-shadow: 0 2px 5px #2c1608, 0 0 10px rgba(255,184,83,.6);
  animation: unova-minecart-impact-fade .92s ease-out both;
}

.unova-minecart-impact-fx strong {
  position: relative;
  z-index: 3;
  font-size: 18px;
  letter-spacing: .06em;
}

.unova-minecart-impact-fx > span {
  position: relative;
  z-index: 3;
  margin-top: 2px;
  font-size: 10px;
  font-weight: 900;
}

.unova-minecart-impact-ring,
.unova-minecart-impact-dust {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
}

.unova-minecart-impact-ring {
  width: 54px;
  height: 22px;
  border: 4px solid rgba(255, 209, 119, .9);
  box-shadow: 0 0 18px rgba(255, 178, 74, .72);
  animation: unova-minecart-impact-ring .7s ease-out both;
}

.unova-minecart-impact-dust {
  width: 42px;
  height: 42px;
  background:
    radial-gradient(circle at 20% 64%, rgba(194,136,75,.88) 0 8%, transparent 9%),
    radial-gradient(circle at 40% 30%, rgba(230,177,105,.86) 0 11%, transparent 12%),
    radial-gradient(circle at 67% 55%, rgba(173,111,57,.9) 0 10%, transparent 11%),
    radial-gradient(circle at 82% 24%, rgba(239,194,123,.76) 0 7%, transparent 8%);
  filter: blur(.2px) drop-shadow(0 3px 3px rgba(55,30,13,.45));
  animation: unova-minecart-impact-dust .82s ease-out both;
}

.field-unit.unova-minecart-damage-hit {
  animation: unova-minecart-unit-hit .48s cubic-bezier(.18,.75,.25,1) both !important;
}

@keyframes unova-minecart-hud-impact {
  0% { transform: translateX(0) scale(1); filter: brightness(1); }
  18% { transform: translateX(-5px) scale(1.04); filter: brightness(1.5); }
  36% { transform: translateX(5px) scale(.98); }
  54% { transform: translateX(-3px) scale(1.01); }
  100% { transform: translateX(0) scale(1); filter: brightness(1); }
}

@keyframes unova-minecart-burst-label {
  0% { opacity: 0; transform: translate(-50%, -5px) scale(.8); }
  22% { opacity: 1; transform: translate(-50%, 4px) scale(1.08); }
  72% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, 10px) scale(.98); }
}

@keyframes unova-minecart-impact-ring {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.3); }
  20% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(5.4, 2.8); }
}

@keyframes unova-minecart-impact-dust {
  0% { opacity: 0; transform: translate(-50%, -25%) scale(.5); }
  18% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -105%) scale(4.8); }
}

@keyframes unova-minecart-impact-fade {
  0% { opacity: 0; }
  12%, 68% { opacity: 1; }
  100% { opacity: 0; }
}

@keyframes unova-minecart-unit-hit {
  0% { transform: translateY(0) rotate(0); filter: brightness(1); }
  20% { transform: translateY(-5px) rotate(-1.5deg); filter: brightness(1.8) sepia(.4); }
  42% { transform: translateY(3px) rotate(1.5deg); }
  64% { transform: translateY(-2px) rotate(-.7deg); }
  100% { transform: translateY(0) rotate(0); filter: brightness(1); }
}

'''
          assert marker in s, 'Clay CSS insertion marker not found'
          s = s.replace(marker, extra + marker, 1)

          old = '''  .unova-minecart-hud,
  .unova-drayden-hud {
    top: 58px;
    padding: 7px 10px 8px;
    min-width: 78vw;
  }
'''
          new = '''  .unova-minecart-hud,
  .unova-drayden-hud {
    top: 58px;
    padding: 7px 10px 8px;
    min-width: 78vw;
  }

  .unova-minecart-hud {
    left: 8px;
    top: 54px;
    transform: none;
    width: min(180px, 54vw);
    min-width: 0;
    padding: 5px 7px 6px;
  }
'''
          assert old in s, 'mobile HUD block not found'
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/engine/engine.js src/components/battle/UnovaBattleUi.jsx src/styles/unova-battle.css
