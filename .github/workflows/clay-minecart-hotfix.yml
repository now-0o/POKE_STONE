name: Clay minecart patch runner

on:
  push:
    paths:
      - '.github/clay-minecart-patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/clay-minecart-patch.py
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/engine/engine.js src/components/battle/UnovaBattleUi.jsx src/styles/unova-battle.css
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'feat: improve Clay minecart gimmick'
          git push
