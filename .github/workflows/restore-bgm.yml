name: Restore Sinnoh BGM

on:
  push:
    paths:
      - ".audio-staging/READY"

permissions:
  contents: write

jobs:
  restore-bgm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild audio files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/audio/bgm
          cat .audio-staging/sinnoh/part-* | base64 --decode > public/audio/bgm/sinnoh.mp3
          cat .audio-staging/cynthia/part-* | base64 --decode > public/audio/bgm/cynthia.mp3
          test -s public/audio/bgm/sinnoh.mp3
          test -s public/audio/bgm/cynthia.mp3

      - name: Commit restored BGM
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/bgm/sinnoh.mp3 public/audio/bgm/cynthia.mp3
          git rm -r .audio-staging
          git commit -m "fix: 신오 및 난천 BGM 파일 복원"
          git push
