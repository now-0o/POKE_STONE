name: Lenora hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch Lenora review rule
        run: |
          python - <<'PY'
          from pathlib import Path

          engine = Path('src/engine/engine.js')
          text = engine.read_text()

          old = '''function lenoraExtraCost(card, game, side) {
            if (side !== "player" || game?.trainer?.gimmick !== "lenora_review") return 0;
            const p = game.players.player;
            const kind = reviewCardKind(card);
            return kind && kind === p._reviewPenaltyKind && !p._reviewPenaltyUsed ? 2 : 0;
          }'''
          new = '''function lenoraExtraCost(card, game, side) {
            if (side !== "player" || game?.trainer?.gimmick !== "lenora_review") return 0;
            const p = game.players.player;
            const kind = reviewCardKind(card);
            return kind && kind === p._reviewPenaltyKind ? 1 : 0;
          }'''
          if old not in text:
            raise SystemExit('lenoraExtraCost block not found')
          text = text.replace(old, new, 1)

          text = text.replace(
            'game.logs.push(`알로에의 복습 시험! 다음 턴 첫 ${label} 카드 비용 +2!`);',
            'game.log.push(`알로에의 복습 시험! 다음 턴 ${label} 카드 전체 비용 +1!`);',
            1,
          )

          text = text.replace('    game.players.player._reviewPenaltyUsed = false;\n', '', 1)
          text = text.replace('        if (kind === p._reviewPenaltyKind && !p._reviewPenaltyUsed) p._reviewPenaltyUsed = true;\n', '', 1)

          old_reset = '''\n  if (game.trainer?.gimmick === "lenora_review" && game.turn === "player") {
    game.players.player._reviewPenaltyUsed = false;
  }\n'''
          if old_reset not in text:
            raise SystemExit('Lenora penalty reset block not found')
          text = text.replace(old_reset, '\n', 1)

          engine.write_text(text)

          ui = Path('src/components/battle/UnovaBattleUi.jsx')
          ui_text = ui.read_text()
          ui_text = ui_text.replace(
            '"다음 플레이어 턴에는 기록된 종류의 첫 카드 비용이 2 증가합니다.",',
            '"다음 플레이어 턴에는 기록된 종류의 모든 카드 비용이 1 증가합니다.",',
            1,
          )
          ui.write_text(ui_text)
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit validated hotfix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/engine/engine.js src/components/battle/UnovaBattleUi.jsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: repair Lenora review exam"
          git push
