name: Fix Brycen and Normal Gem

on:
  push:
    paths:
      - '.github/fix-brycen-normalgem-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) 담죽 냉기 UI: 같은 textContent를 반복 기록해 MutationObserver를 재귀 호출하던 루프 제거
          p = Path('src/components/battle/UnovaBattleUi.jsx')
          s = p.read_text()
          old = '''      if (frostValue > 0) {
        const overlay = ensureOverlay(element, "unova-frost-overlay", `❄ ${frostValue}/2`);
        const label = overlay.querySelector("span");
        if (label) label.textContent = `❄ ${frostValue}/2`;
      } else {
        removeOverlay(element, "unova-frost-overlay");
      }'''
          new = '''      if (frostValue > 0) {
        const nextLabel = `❄ ${frostValue}/2`;
        const overlay = ensureOverlay(element, "unova-frost-overlay", nextLabel);
        const label = overlay.querySelector("span");
        // textContent 변경도 childList mutation을 만들 수 있으므로 값이 바뀔 때만 쓴다.
        if (label && label.textContent !== nextLabel) label.textContent = nextLabel;
      } else {
        removeOverlay(element, "unova-frost-overlay");
      }'''
          assert old in s, 'Brycen frost label block not found'
          s = s.replace(old, new, 1)

          old = '''  window.addEventListener("unova-gym-state-change", () => {
    syncUnitEffects();
    syncUnovaBattleUi();
  });'''
          new = '''  // syncUnovaBattleUi 안에서 syncUnitEffects까지 처리하므로 상태 이벤트당 한 번만 동기화한다.
  window.addEventListener("unova-gym-state-change", syncUnovaBattleUi);'''
          assert old in s, 'Unova state listener block not found'
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 2) 노말주얼: 포켓몬뿐 아니라 트레이너 직접 기본 공격에도 +2 후 소모
          p = Path('src/engine/engine.js')
          s = p.read_text()
          old = '''  let temporaryAtk = 0;
  if (
    game.trainer?.gimmick === "elesa_spotlight" &&'''
          new = '''  // 노말주얼은 대상이 포켓몬이든 트레이너든 다음 기본 공격에 발동한다.
  // 포켓몬 대상은 base 엔진이 처리하므로, 여기서는 hero 직접 공격만 보정한다.
  const normalGemHeroBonus = isHeroTarget && attacker.item === "normal_gem" ? 2 : 0;
  let temporaryAtk = normalGemHeroBonus;
  if (
    game.trainer?.gimmick === "elesa_spotlight" &&'''
          assert old in s, 'temporaryAtk block not found'
          s = s.replace(old, new, 1)

          old = '''  if (!result) {
    syncUnovaState(game);
    return result;
  }

  const currentTarget = isHeroTarget'''
          new = '''  if (!result) {
    syncUnovaState(game);
    return result;
  }

  if (normalGemHeroBonus > 0 && attacker.item === "normal_gem") {
    attacker.item = null;
    game.log.push(`${attacker.name}의 노말주얼! 이번 공격 피해 +2!`);
  }

  const currentTarget = isHeroTarget'''
          assert old in s, 'post-attack result block not found'
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/battle/UnovaBattleUi.jsx src/engine/engine.js
          git commit -m "fix: Normal Gem hero attacks and Brycen freeze UI loop"
          git push
